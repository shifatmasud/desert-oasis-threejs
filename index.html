<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desert Oasis — Golden Hour (Three.js)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #14101a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(18, 14, 24, 0.45);
      color: rgba(255, 244, 228, 0.88);
      font: 12px/1.4 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.03em;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div id="hint">Hover or scrub to ripple · Tap anywhere for ambient sound · Drag to orbit</div>
  <script>
    window.addEventListener('error', (e) => {
      const h = document.getElementById('hint');
      if (h) h.textContent = 'ERR: ' + e.message + ' (' + e.lineno + ')';
    });
    window.addEventListener('unhandledrejection', (e) => {
      const h = document.getElementById('hint');
      if (h) h.textContent = 'REJ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // ------------------------------------------------------------
    // 1. Renderer, Scene, Camera & Post-Processing
    // ------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xefc8a2, 0.0055);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.4,
      320
    );
    camera.position.set(0, 3.15, 17.8);

    const isPhone = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth <= 820;
    const renderer = new THREE.WebGLRenderer({ antialias: !isPhone, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1.0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.96;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Procedural Golden-Hour HDRI Environment Map (PMREM IBL for real PBR leaf/bark/stone/sand sheen)
    const sunDir = new THREE.Vector3(-72, 22, -22).normalize();
    (function buildGoldenHourIBL() {
      const w = 256, h = 128;
      const data = new Float32Array(w * h * 4);
      const dir = new THREE.Vector3();
      for (let y = 0; y < h; y++) {
        const v = y / (h - 1);
        const theta = (1.0 - v) * Math.PI;
        const sinT = Math.sin(theta), cosT = Math.cos(theta);
        for (let x = 0; x < w; x++) {
          const u = x / (w - 1);
          const phi = u * Math.PI * 2.0;
          dir.set(-sinT * Math.sin(phi), cosT, -sinT * Math.cos(phi));
          let r, g, b;
          if (dir.y >= 0.0) {
            const hy = Math.min(dir.y, 1.0);
            const t1 = THREE.MathUtils.smoothstep(hy, 0.0, 0.16);
            const t2 = THREE.MathUtils.smoothstep(hy, 0.08, 0.35);
            r = THREE.MathUtils.lerp(1.05, 0.84, t1);
            g = THREE.MathUtils.lerp(0.76, 0.58, t1);
            b = THREE.MathUtils.lerp(0.52, 0.68, t1);
            r = THREE.MathUtils.lerp(r, 0.32, t2);
            g = THREE.MathUtils.lerp(g, 0.44, t2);
            b = THREE.MathUtils.lerp(b, 0.78, t2);
            const sDot = Math.max(dir.dot(sunDir), 0.0);
            const sunGlow = Math.pow(sDot, 12.0) * 1.4 + Math.pow(sDot, 180.0) * 5.5;
            r += sunGlow * 1.0;
            g += sunGlow * 0.84;
            b += sunGlow * 0.56;
          } else {
            // Warm sand & turquoise-oasis ground bounce
            const gy = Math.min(-dir.y, 1.0);
            r = THREE.MathUtils.lerp(0.62, 0.36, gy);
            g = THREE.MathUtils.lerp(0.46, 0.28, gy);
            b = THREE.MathUtils.lerp(0.28, 0.20, gy);
          }
          const idx = (y * w + x) * 4;
          data[idx] = r; data[idx + 1] = g; data[idx + 2] = b; data[idx + 3] = 1.0;
        }
      }
      const equirect = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
      equirect.mapping = THREE.EquirectangularReflectionMapping;
      equirect.needsUpdate = true;
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envRT = pmrem.fromEquirectangular(equirect);
      scene.environment = envRT.texture;
      scene.environmentIntensity = 0.28;
      equirect.dispose();
      pmrem.dispose();
    })();

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.22,
      0.55,
      0.84
    );
    composer.addPass(bloomPass);

    const animeFilmicPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 },
        uSunScreenPos: { value: new THREE.Vector2(0.18, 0.78) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform vec2 uSunScreenPos;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        void main() {
          // Subtle 65mm cinema edge softness + micro chromatic fringe at extreme corners
          vec2 d = vUv - 0.5;
          float rLen = length(d);
          float edgeSoft = smoothstep(0.28, 0.72, rLen) * 0.0014;
          float ca = smoothstep(0.42, 0.76, rLen) * 0.0009;
          vec3 col = vec3(
            texture2D(tDiffuse, vUv + d * ca).r,
            texture2D(tDiffuse, vUv).g,
            texture2D(tDiffuse, vUv - d * ca).b
          );
          if (edgeSoft > 0.00005) {
            col = (
              col * 0.4 +
              texture2D(tDiffuse, vUv + vec2(edgeSoft, 0.0)).rgb * 0.15 +
              texture2D(tDiffuse, vUv - vec2(edgeSoft, 0.0)).rgb * 0.15 +
              texture2D(tDiffuse, vUv + vec2(0.0, edgeSoft)).rgb * 0.15 +
              texture2D(tDiffuse, vUv - vec2(0.0, edgeSoft)).rgb * 0.15
            );
          }

          // Screen-space crepuscular sun-shafts streaming between left palm fronds
          vec2 clampedSun = vec2(max(uSunScreenPos.x, 0.06), clamp(uSunScreenPos.y, 0.68, 0.88));
          vec2 rayStep = (clampedSun - vUv) * (0.55 / 14.0);
          vec2 rayUv = vUv;
          float shafts = 0.0;
          float decay = 1.0;
          for (int i = 0; i < 14; i++) {
            rayUv += rayStep;
            vec3 sCol = texture2D(tDiffuse, clamp(rayUv, 0.001, 0.999)).rgb;
            float sLum = dot(sCol, vec3(0.2126, 0.7152, 0.0722));
            shafts += smoothstep(0.62, 0.92, sLum) * decay;
            decay *= 0.87;
          }
          float sunProx = exp(-length((vUv - clampedSun) * vec2(0.85, 1.25)) * 1.35);
          col += vec3(1.0, 0.82, 0.50) * (shafts / 14.0) * sunProx * 0.48;

          // Subtle golden-hour anamorphic streak from upper-left sun
          float anamorphic = exp(-abs(vUv.y - clampedSun.y) * 34.0) * exp(-abs(vUv.x - clampedSun.x) * 3.8);
          col += vec3(1.0, 0.86, 0.62) * anamorphic * 0.12;

          // Unified golden-hour sunset color grade (keep true deep shadows + warm gold highlights)
          float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
          vec3 shadowLift = vec3(0.010, 0.006, 0.012) * (1.0 - smoothstep(0.0, 0.22, lum));
          col += shadowLift;
          vec3 highlightTint = vec3(1.06, 0.99, 0.88);
          col = mix(col, col * highlightTint, smoothstep(0.25, 0.85, lum));

          // Punchy filmic S-curve contrast for 3D depth
          col = col * col * (3.0 - 2.0 * col) * 0.28 + col * 0.72;

          // Subtle cinema vignette
          float vig = 1.0 - dot(d, d) * 0.24;
          col *= vig;

          // Fine 35mm grain
          float grain = (hash(vUv * 1200.0 + fract(uTime) * 37.0) - 0.5) * 0.011;
          col += grain;

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
        }
      `
    });
    composer.addPass(animeFilmicPass);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, -4.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.minDistance = 4.5;
    controls.maxDistance = 48;
    controls.update();

    // ------------------------------------------------------------
    // 2. Golden-Hour Lighting (Low Sun from Left -> Sculpted Slip-Faces)
    // ------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xffdfb8, 0x8a6440, 0.65);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xffcf88, 4.0);
    sunLight.position.copy(sunDir).multiplyScalar(95);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(isPhone ? 1024 : 1536, isPhone ? 1024 : 1536);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 220;
    sunLight.shadow.camera.left = -64;
    sunLight.shadow.camera.right = 64;
    sunLight.shadow.camera.top = 52;
    sunLight.shadow.camera.bottom = -52;
    sunLight.shadow.bias = -0.0001;
    sunLight.shadow.normalBias = 0.05;
    scene.add(sunLight);

    const bounceLight = new THREE.DirectionalLight(0xffcfa0, 0.55);
    bounceLight.position.set(18, 12, 32);
    scene.add(bounceLight);

    // ------------------------------------------------------------
    // 3. Sky Dome & Soft Golden-Hour Cumulus Clouds
    // ------------------------------------------------------------
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTime: { value: 0 },
        uSunDir: { value: sunDir }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform vec3 uSunDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p = rot * p * 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);

          vec3 horizon = vec3(1.00, 0.78, 0.56);
          vec3 roseMid = vec3(0.84, 0.58, 0.68);
          vec3 zenith  = vec3(0.30, 0.40, 0.70);

          vec3 col = mix(horizon, roseMid, smoothstep(0.0, 0.11, h));
          col = mix(col, zenith, smoothstep(0.07, 0.24, h));

          float sunAmt = max(dot(dir, uSunDir), 0.0);
          col += vec3(1.0, 0.78, 0.46) * pow(sunAmt, 2.8) * 0.34;

          if (dir.y > 0.02) {
            vec2 uv = dir.xz / (dir.y + 0.20) * 1.12 + vec2(uTime * 0.0014, 0.0);
            float c1 = fbm(uv * 1.55);
            float c2 = fbm(uv * 3.1 + vec2(4.2, 1.7));
            float cloudDensity = c1 * 0.74 + c2 * 0.26;

            float band = smoothstep(0.05, 0.16, dir.y) * smoothstep(0.44, 0.22, dir.y);
            float mask = smoothstep(0.44, 0.58, cloudDensity) * band;
            float litEdge = smoothstep(0.36, 0.68, c1);
            vec3 cloudShadow = vec3(0.70, 0.46, 0.64);
            vec3 cloudLit    = vec3(1.00, 0.89, 0.74);
            vec3 cloudCol = mix(cloudShadow, cloudLit, litEdge);
            col = mix(col, cloudCol, mask * 0.92);
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(240, 48, 32), skyMat));

    // ------------------------------------------------------------
    // 4. Sculpted Desert Dunes & Wet-to-Dry Shoreline Sand
    // ------------------------------------------------------------
    function smoothAbs(x, eps = 0.16) {
      return Math.sqrt(x * x + eps * eps);
    }

    function basinRadiusFactor(x, z) {
      const dx = x / 12.8;
      const dz = (z - 0.6) / 8.5;
      const theta = Math.atan2(dz, dx);
      const mod = 1.0 + 0.09 * Math.sin(theta * 2.0 + 0.55) + 0.06 * Math.cos(theta * 3.0 - 0.8) + 0.03 * Math.sin(theta * 5.0);
      return Math.sqrt(dx * dx + dz * dz) / mod;
    }

    function duneRidge(x, z, cx, cz, angle, width, length, height, asym = 0.75, curveAmp = 0.28) {
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const rx = (x - cx) * ca - (z - cz) * sa;
      const rz = (x - cx) * sa + (z - cz) * ca;
      const crestOffset = Math.sin(rz / length * 2.2 + 0.4) * (width * curveAmp);
      const u = (rx - crestOffset) / width;
      const side = u < 0 ? smoothAbs(u, 0.16) : smoothAbs(u, 0.16) * (1.0 + asym);
      const ridge = Math.max(0, 1.0 - side);
      const smooth = Math.pow(ridge, 1.45);
      const along = Math.exp(-Math.pow(rz / length, 2));
      return smooth * along * height;
    }

    function getTerrainHeight(x, z) {
      const r = basinRadiusFactor(x, z);
      const r2 = r * r;

      // Gradual shallow sandy shelf sloping smoothly into the deep central basin
      const shelfSlope = -0.32 * THREE.MathUtils.smoothstep(1.04 - r, 0.0, 0.34);
      const deepBasin = -1.52 * Math.exp(-r2 * 2.35);
      const poolDepth = shelfSlope + deepBasin;
      const basinMask = Math.exp(-r2 * 1.18);

      const centerPeak = duneRidge(x, z, 2.2, -46, -0.18, 28, 24, 10.6, 0.95, 0.26);
      const leftMid    = duneRidge(x, z, -24, -34, -0.45, 28, 26, 7.6, 0.85, 0.20);
      const leftOuter  = duneRidge(x, z, -46, -24, -0.25, 34, 34, 10.2, 0.75, 0.16);
      const rightMid   = duneRidge(x, z, 31, -28, 0.42, 34, 32, 8.8, 0.85, 0.18);
      const farLeft    = duneRidge(x, z, -60, -82, 0.12, 46, 40, 12.5, 0.65, 0.15);
      const farRight   = duneRidge(x, z, 62, -78, -0.18, 48, 40, 10.5, 0.65, 0.15);

      const outerFade = THREE.MathUtils.smoothstep(r, 0.92, 2.05);
      const dunes = Math.max(centerPeak, leftMid * 0.92, leftOuter * 0.96, rightMid, farLeft * 0.95, farRight * 0.95)
                  + 0.22 * (centerPeak + leftMid + rightMid);
      const beachSlope = THREE.MathUtils.smoothstep(r, 0.96, 1.55) * 0.56;
      const camClear = 1.0 - Math.exp(-Math.pow(x / 11.5, 2) - Math.pow((z - 17.5) / 7.5, 2));

      return poolDepth + (dunes * outerFade + beachSlope) * (1.0 - basinMask * 0.94) * (0.25 + 0.75 * camClear);
    }

    function createSandBumpTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(512, 512);
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const warp = Math.sin(x * 0.035) * 4.5 + Math.cos(x * 0.09) * 1.4;
          const ripple = Math.sin(y * 0.34 + warp) * 0.5 + 0.5;
          const fine = Math.sin(y * 0.72 + warp * 1.3) * 0.5 + 0.5;
          const grain = Math.abs((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1);
          const v = Math.floor((ripple * 0.60 + fine * 0.18 + grain * 0.22) * 255);
          const idx = (y * 512 + x) * 4;
          img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = v;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(54, 54);
      return tex;
    }

    const terrainGeo = new THREE.PlaneGeometry(250, 250, isPhone ? 92 : 120, isPhone ? 92 : 120);
    terrainGeo.rotateX(-Math.PI / 2);
    const tPos = terrainGeo.attributes.position;
    const tColors = new Float32Array(tPos.count * 3);

    const deepWetSand = new THREE.Color(0x7c5838);
    const wetSand = new THREE.Color(0xb8864c);
    const warmSand = new THREE.Color(0xe4b26e);
    const sunlitSand = new THREE.Color(0xf7d89c);
    const cTmp = new THREE.Color();

    // Plant cluster centers for soft ground contact AO under bushes & palms
    const aoSpots = [
      [-10.6, 3.8, 3.2], [-11.4, 0.4, 3.4], [-9.4, -3.6, 3.2],
      [10.6, 3.8, 3.2],  [11.4, 0.4, 3.4],  [9.4, -3.6, 3.2],
      [-4.9, 11.2, 2.8], [4.9, 11.2, 2.8],
      [-4.2, 11.4, 2.6], [-2.9, 13.0, 2.6], [-1.7, 14.3, 2.2], [-4.8, 12.6, 2.6],
      [4.2, 11.4, 2.6],  [2.9, 13.0, 2.6],  [1.9, 14.2, 2.2],  [4.8, 12.4, 2.6],
      [-9.6, 11.4, 2.5], [9.8, 11.2, 2.5], [-6.8, -5.2, 2.6], [6.8, -5.0, 2.6]
    ];

    for (let i = 0; i < tPos.count; i++) {
      const x = tPos.getX(i);
      const z = tPos.getZ(i);
      const y = getTerrainHeight(x, z);
      tPos.setY(i, y);

      if (y < 0.05) {
        cTmp.copy(deepWetSand).lerp(wetSand, THREE.MathUtils.clamp((y + 0.12) / 0.17, 0, 1));
      } else if (y < 0.48) {
        cTmp.copy(wetSand).lerp(warmSand, THREE.MathUtils.clamp((y - 0.05) / 0.43, 0, 1));
      } else {
        cTmp.copy(warmSand).lerp(sunlitSand, THREE.MathUtils.clamp((y - 0.48) / 9.5, 0, 1));
      }

      // Soft contact AO under vegetation clusters
      let ao = 1.0;
      for (let k = 0; k < aoSpots.length; k++) {
        const dx = x - aoSpots[k][0];
        const dz = z - aoSpots[k][1];
        const r = aoSpots[k][2];
        const d2 = dx * dx + dz * dz;
        if (d2 < r * r) {
          ao *= 0.62 + 0.38 * (d2 / (r * r));
        }
      }
      cTmp.multiplyScalar(ao);

      tColors[i * 3] = cTmp.r;
      tColors[i * 3 + 1] = cTmp.g;
      tColors[i * 3 + 2] = cTmp.b;
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
    terrainGeo.computeVertexNormals();

    const sandBumpTex = createSandBumpTexture();
    sandBumpTex.wrapS = sandBumpTex.wrapT = THREE.RepeatWrapping;
    sandBumpTex.repeat.set(36, 36);
    sandBumpTex.anisotropy = 4;

    const terrainTimeUniform = { value: 0 };
    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.90,
      metalness: 0.0,
      bumpMap: sandBumpTex,
      bumpScale: 0.04
    });
    terrainMat.onBeforeCompile = (shader) => {
      shader.uniforms.uSunDirSand = { value: sunDir };
      shader.uniforms.uSandTime = terrainTimeUniform;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vSandWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvSandWorldPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
varying vec3 vSandWorldPos;
uniform vec3 uSunDirSand;
uniform float uSandTime;
float sandHash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float sandNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(sandHash(i), sandHash(i + vec2(1.0, 0.0)), f.x),
    mix(sandHash(i + vec2(0.0, 1.0)), sandHash(i + vec2(1.0, 1.0)), f.x),
    f.y
  );
}`)
        .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{
  // Velvety desert sand micro-grain with ultra-subtle wind ripples (zero corduroy stripes)
  vec2 sp = vSandWorldPos.xz;

    function createPalmBarkTextures() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      b.width = 256;
      b.height = 512;

      ctx.fillStyle = '#5c412d';
      ctx.fillRect(0, 0, 256, 512);
      btx.fillStyle = '#606060';
      btx.fillRect(0, 0, 256, 512);

      // Diamond-shaped leaf-scar scales typical of real date/coconut palms
      const rows = 28;
      const cols = 6;
      const rh = 512 / rows;
      const cw = 256 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let col = -1; col <= cols; col++) {
          const x = col * cw + offset;
          const y = r * rh;

          // Color diamond
          const g = ctx.createLinearGradient(x, y, x, y + rh);
          g.addColorStop(0.0, '#7a593e');
          g.addColorStop(0.55, '#593e2b');
          g.addColorStop(1.0, '#362317');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(x + cw * 0.5, y);
          ctx.lineTo(x + cw, y + rh * 0.55);
          ctx.lineTo(x + cw * 0.5, y + rh);
          ctx.lineTo(x, y + rh * 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(30, 18, 10, 0.55)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Bump diamond
          const bg = btx.createLinearGradient(x, y, x, y + rh);
          bg.addColorStop(0.0, '#d8d8d8');
          bg.addColorStop(0.7, '#787878');
          bg.addColorStop(1.0, '#222222');
          btx.fillStyle = bg;
          btx.beginPath();
          btx.moveTo(x + cw * 0.5, y);
          btx.lineTo(x + cw, y + rh * 0.55);
          btx.lineTo(x + cw * 0.5, y + rh);
          btx.lineTo(x, y + rh * 0.55);
          btx.closePath();
          btx.fill();
        }
      }

      const map = new THREE.CanvasTexture(c);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(1, 5);
      map.colorSpace = THREE.SRGBColorSpace;

      const bumpMap = new THREE.CanvasTexture(b);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(1, 5);

      return { map, bumpMap };
    }

        const mx = (Math.sin(i * 12.7) * 0.5 + 0.5) * 256;
        const my = (Math.cos(i * 7.3) * 0.5 + 0.5) * 512;
        const mr = 14 + (i % 5) * 8;
        const rg = ctx.createRadialGradient(mx, my, 1, mx, my, mr);
        rg.addColorStop(0, i % 2 === 0 ? 'rgba(30, 52, 18, 0.22)' : 'rgba(92, 118, 48, 0.14)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
      }

      // Fine recessed/raised secondary veins (both color & bump)
      for (let y = 52; y < 484; y += 16) {
        ctx.strokeStyle = 'rgba(26, 44, 16, 0.34)';
        ctx.lineWidth = 1.4;
        bctx.strokeStyle = '#b8b8b8';
        bctx.lineWidth = 2.0;
        for (const g of [ctx, bctx]) {
          g.beginPath();
          g.moveTo(128, y);
          g.quadraticCurveTo(75, y - 16, 16, y - 44);
          g.stroke();
          g.beginPath();
          g.moveTo(128, y);
          g.quadraticCurveTo(181, y - 16, 240, y - 44);
          g.stroke();
        }
      }

      ctx.strokeStyle = 'rgba(110, 134, 62, 0.42)';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(128, 508); ctx.lineTo(128, 16); ctx.stroke();

      bctx.strokeStyle = '#e8e8e8';
      bctx.lineWidth = 4.5;
      bctx.beginPath(); bctx.moveTo(128, 508); bctx.lineTo(128, 16); bctx.stroke();
      ctx.restore();

      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(b);
      return { map, bumpMap };
    }

    // High-res alpha-cutout fern frond texture (organic rounded pinnae + midrib bump)
    function createFernTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 1024;
      const ctx = c.getContext('2d');
      const b = document.createElement('canvas');
      b.width = 512;
      b.height = 1024;
      const bctx = b.getContext('2d');

      ctx.clearRect(0, 0, 512, 1024);
      bctx.fillStyle = '#707070';
      bctx.fillRect(0, 0, 512, 1024);

      ctx.strokeStyle = '#2d4518';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(256, 1010); ctx.lineTo(256, 20); ctx.stroke();

      bctx.strokeStyle = '#e0e0e0';
      bctx.lineWidth = 7;
      bctx.beginPath(); bctx.moveTo(256, 1010); bctx.lineTo(256, 20); bctx.stroke();

      const pairs = 28;
      for (let i = 0; i < pairs; i++) {
        const t = i / (pairs - 1);
        const y = 980 - t * 930;
        const span = Math.sin(Math.pow(t, 0.65) * Math.PI) * 215 + 16;
        const w = 18 * (1.0 - t * 0.45);

        for (const side of [-1, 1]) {
          const tipX = 256 + side * span;
          const tipY = y - 22 - t * 18;
          const g = ctx.createLinearGradient(256, y, tipX, tipY);
          g.addColorStop(0, '#223814');
          g.addColorStop(0.6, '#38581f');
          g.addColorStop(1, '#58752b');

          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(256, y + w * 0.5);
          ctx.quadraticCurveTo(256 + side * span * 0.55, y + w * 0.45, tipX, tipY);
          ctx.quadraticCurveTo(256 + side * span * 0.45, y - w * 0.85, 256, y - w * 0.55);
          ctx.closePath();
          ctx.fill();

          bctx.strokeStyle = '#b4b4b4';
          bctx.lineWidth = 2;
          bctx.beginPath();
          bctx.moveTo(256, y);
          bctx.quadraticCurveTo(256 + side * span * 0.5, y - 5, tipX, tipY);
          bctx.stroke();
        }
      }

      const map = new THREE.CanvasTexture(c);
      map.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(b);
      return { map, bumpMap };
    }

    // Individual cupped hibiscus petal texture (ruffled edge + deep throat + radial veins)
    function createPetalTexture(throatHex, midHex, edgeHex) {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(128, 250);
      ctx.bezierCurveTo(60, 210, 12, 100, 48, 34);
      ctx.bezierCurveTo(86, 6, 170, 6, 208, 34);
      ctx.bezierCurveTo(244, 100, 196, 210, 128, 250);
      ctx.closePath();
      ctx.clip();

      const grad = ctx.createRadialGradient(128, 245, 8, 128, 140, 220);
      grad.addColorStop(0.0, throatHex);
      grad.addColorStop(0.28, midHex);
      grad.addColorStop(1.0, edgeHex);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = 'rgba(255,255,255,0.14)';
      ctx.lineWidth = 2;
      for (let i = -5; i <= 5; i++) {
        ctx.beginPath();
        ctx.moveTo(128, 250);
        ctx.quadraticCurveTo(128 + i * 16, 130, 128 + i * 24, 18);
        ctx.stroke();
      }
      ctx.restore();

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const texLoader = new THREE.TextureLoader();
    const gltfLoader = new GLTFLoader();

    // Real Quixel Megascans Seamless Palm Bark PBR Textures (TubeGeometry: U = length, V = circumference)
    const barkMap = texLoader.load('./assets/trunk/trunk_B.jpg');
    barkMap.colorSpace = THREE.SRGBColorSpace;
    barkMap.wrapS = barkMap.wrapT = THREE.RepeatWrapping;

    const barkNormal = texLoader.load('./assets/trunk/trunk_N.jpg');

    barkNormal.center.set(0.5, 0.5);
    barkNormal.rotation = Math.PI / 2;
    barkNormal.repeat.set(9, 1.5);

    const barkORM = texLoader.load('./assets/trunk/trunk_ORM.jpg');
    barkORM.wrapS = barkORM.wrapT = THREE.RepeatWrapping;
    barkORM.center.set(0.5, 0.5);

    const barkMat = new THREE.MeshStandardMaterial({
      map: barkMap,

    });

    // Real Quixel Megascans Palm Stems & Leaves Atlas (sdjdqfh2)
    const frondMap = texLoader.load('./assets/frond/frond_RGBA.png');
    frondMap.colorSpace = THREE.SRGBColorSpace;
    frondMap.anisotropy = 4;
    const frondNormal = texLoader.load('./assets/frond/frond_N.jpg');
    frondNormal.anisotropy = 4;

    const frondMat = new THREE.MeshStandardMaterial({
      color: 0xc2ce7e,
      map: frondMap,
      normalMap: frondNormal,
      normalScale: new THREE.Vector2(0.75, 0.75),
      alphaTest: 0.28,
      alphaToCoverage: true,
      vertexColors: true,
      roughness: 0.54,
      metalness: 0.0,
      side: THREE.DoubleSide
    });
    frondMat.onBeforeCompile = (shader) => {
      shader.uniforms.uSunDir = { value: sunDir };
      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        '#include <common>\nvarying vec3 vWorldPositionSSS;'
      ).replace(
        '#include <worldpos_vertex>',
        '#include <worldpos_vertex>\nvWorldPositionSSS = (modelMatrix * vec4(transformed, 1.0)).xyz;'
      );
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        '#include <common>\nuniform vec3 uSunDir;\nvarying vec3 vWorldPositionSSS;'
      ).replace(
        '#include <dithering_fragment>',
        `
        vec3 viewDirSSS = normalize(cameraPosition - vWorldPositionSSS);
        vec3 nW = normalize(vNormal);
        float backLight = pow(clamp(dot(viewDirSSS, -uSunDir), 0.0, 1.0), 2.0);
        float throughLeaf = pow(clamp(dot(-nW, uSunDir) * 0.5 + 0.5, 0.0, 1.0), 1.6);
        float rimGlow = pow(1.0 - abs(dot(nW, viewDirSSS)), 1.7);
        vec3 sssTint = vec3(0.98, 0.84, 0.32) * (backLight * 0.65 + throughLeaf * 0.34 + rimGlow * 0.36) + vec3(0.22, 0.19, 0.08);
        gl_FragColor.rgb += sssTint * diffuseColor.rgb;
        #include <dithering_fragment>
        `
      );
    };

    // Shared physical backlit translucency helper so all foliage derives gold from sunLight, not fake emissive
    function applyFoliageSSS(mat, strength = 0.55) {
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uSunDir = { value: sunDir };
        shader.vertexShader = shader.vertexShader.replace(
          '#include <common>',
          '#include <common>\nvarying vec3 vWorldPosLeaf;'
        ).replace(
          '#include <worldpos_vertex>',
          '#include <worldpos_vertex>\nvWorldPosLeaf = (modelMatrix * vec4(transformed, 1.0)).xyz;'
        );
        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          '#include <common>\nuniform vec3 uSunDir;\nvarying vec3 vWorldPosLeaf;'
        ).replace(
          '#include <dithering_fragment>',
          `
          vec3 vDirL = normalize(cameraPosition - vWorldPosLeaf);
          float backL = pow(clamp(dot(vDirL, -uSunDir), 0.0, 1.0), 2.4);
          float sunUp = clamp(dot(normalize(vNormal), uSunDir) * 0.5 + 0.5, 0.0, 1.0);
          float groundBounce = smoothstep(0.55, -0.05, vWorldPosLeaf.y);
          gl_FragColor.rgb += vec3(0.95, 0.74, 0.28) * diffuseColor.rgb * (backL * ${strength.toFixed(2)} + sunUp * 0.16) + vec3(0.11, 0.08, 0.05) * diffuseColor.rgb;
          gl_FragColor.rgb += vec3(0.24, 0.16, 0.08) * groundBounce * (0.35 + 0.65 * diffuseColor.rgb);
          #include <dithering_fragment>
          `
        );
      };
    }

    const broadLeafTex = createBroadLeafTexture();
    const broadLeafMat = new THREE.MeshStandardMaterial({
      map: broadLeafTex.map,
      bumpMap: broadLeafTex.bumpMap,

    });
    applyFoliageSSS(broadLeafMat, 0.45);

    const broadLeafLightMat = new THREE.MeshStandardMaterial({
      map: broadLeafTex.map,
      bumpMap: broadLeafTex.bumpMap,

    });

    const fernTex = createFernTexture();
    const fernMat = new THREE.MeshStandardMaterial({
      map: fernTex.map,

      color: 0x94a860,
      alphaTest: 0.42,
      roughness: 0.42,

    });
    applyFoliageSSS(fernMat, 0.48);

    // ------------------------------------------------------------
    // 7. Real Palm Trees (Quixel Megascans Stems & Leaflets Atlas + Seamless Bark)
    // ------------------------------------------------------------
    const LEAFLET_UVS = [
      [0.470, 0.506, 0.22, 0.94],
      [0.549, 0.585, 0.19, 0.94],
      [0.626, 0.659, 0.26, 0.93],
      [0.708, 0.740, 0.22, 0.94],
      [0.775, 0.821, 0.24, 0.93],
      [0.859, 0.899, 0.25, 0.92],
      [0.921, 0.954, 0.26, 0.94]
    ];

    function createCurvedPalmFrondGeometry(length, maxLeafLen, pairs = 34, seed = 0, archLift = 0.54, droopPower = 0.36) {
      const positions = [], uvs = [], colors = [], indices = [];
      let vIdx = 0;

      const stemCol = new THREE.Color(0xa6b554);
      const baseCol = new THREE.Color(0x889e3c);
      const midCol  = new THREE.Color(0xb8c954);
      const tipCol  = new THREE.Color(0xefe47c);
      const c = new THREE.Color();

      // Arching Megascans palm stem / rachis (crossed V-ribbon so visible from all angles)
      const stemSegs = 18;
      const uStem0 = 0.197, uStem1 = 0.259;
      for (let i = 0; i < stemSegs; i++) {
        const t0 = i / stemSegs, t1 = (i + 1) / stemSegs;
        const z0 = t0 * length, z1 = t1 * length;
        const y0 = Math.sin(t0 * Math.PI * 0.64) * archLift - Math.pow(t0, 1.75) * length * droopPower;
        const y1 = Math.sin(t1 * Math.PI * 0.64) * archLift - Math.pow(t1, 1.75) * length * droopPower;
        const w0 = 0.062 * (1.0 - t0 * 0.68);
        const w1 = 0.062 * (1.0 - t1 * 0.68);
        const v0 = 0.06 + t0 * 0.88;
        const v1 = 0.06 + t1 * 0.88;

        // Horizontal plane of stem
        positions.push(-w0, y0, z0, w0, y0, z0, -w1, y1, z1, w1, y1, z1);
        uvs.push(uStem0, v0, uStem1, v0, uStem0, v1, uStem1, v1);
        for (let k = 0; k < 4; k++) colors.push(stemCol.r, stemCol.g, stemCol.b);
        indices.push(vIdx, vIdx + 1, vIdx + 2, vIdx + 1, vIdx + 3, vIdx + 2);
        vIdx += 4;

        // Vertical rib of stem
        positions.push(0, y0 - w0 * 0.6, z0, 0, y0 + w0 * 0.6, z0, 0, y1 - w1 * 0.6, z1, 0, y1 + w1 * 0.6, z1);
        uvs.push(uStem0, v0, uStem1, v0, uStem0, v1, uStem1, v1);
        for (let k = 0; k < 4; k++) colors.push(stemCol.r, stemCol.g, stemCol.b);
        indices.push(vIdx, vIdx + 1, vIdx + 2, vIdx + 1, vIdx + 3, vIdx + 2);
        vIdx += 4;
      }

      // 5-row curved 3D Megascans alpha-cutout leaflets along the rachis (wider, fuller overlap)
      const rows = [0.0, 0.25, 0.52, 0.78, 1.0];
      for (let i = 1; i <= pairs; i++) {
        const t = i / (pairs + 1);
        const zBase = t * length * 0.96 + 0.14;
        const yBase = Math.sin(t * Math.PI * 0.64) * archLift - Math.pow(t, 1.75) * length * droopPower;
        const leafLen = Math.pow(Math.max(0, Math.sin(Math.pow(t, 0.72) * Math.PI)), 0.75) * maxLeafLen;
        const cardWidth = 0.225 * (1.0 - t * 0.22);

        if (t < 0.45) {
          c.copy(baseCol).lerp(midCol, t / 0.45);
        } else {
          c.copy(midCol).lerp(tipCol, (t - 0.45) / 0.55);
        }

        for (const side of [-1, 1]) {
          const hash = Math.abs(Math.sin((i * 12.9898 + side * 78.233 + seed * 37.7)));
          const uvBox = LEAFLET_UVS[Math.floor(hash * LEAFLET_UVS.length) % LEAFLET_UVS.length];
          const [uL, uR, vBot, vTop] = uvBox;

          const jitter = Math.sin(i * 2.7 + side + seed) * 0.12;
          const sweep = 0.60 + t * 0.48 + jitter;
          const dirX = side * Math.sin(sweep);
          const dirZ = Math.cos(sweep) * 0.68;

          const twist = side * 0.32 + jitter * 1.2;
          const perpX = -dirZ * Math.sin(twist) * 0.35;
          const perpY = Math.sin(twist) * 0.45;
          const perpZ = Math.cos(twist);

          for (let r = 0; r < rows.length; r++) {
            const f = rows[r];
            const px = dirX * leafLen * f;
            const pz = zBase + dirZ * leafLen * f;
            const py = yBase + Math.sin(f * Math.PI * 0.80) * leafLen * 0.18 - Math.pow(f, 1.95) * leafLen * (0.58 + Math.abs(jitter) * 0.28);

            const halfW = cardWidth * 0.5;
            positions.push(
              px - perpX * halfW, py - perpY * halfW, pz - perpZ * halfW,
              px + perpX * halfW, py + perpY * halfW, pz + perpZ * halfW
            );
            const vUV = vBot + (vTop - vBot) * f;
            uvs.push(uL, vUV, uR, vUV);
            const rowCol = f < 0.35 ? baseCol : c;
            colors.push(rowCol.r, rowCol.g, rowCol.b, rowCol.r, rowCol.g, rowCol.b);
          }

          for (let r = 0; r < rows.length - 1; r++) {
            const a = vIdx + r * 2;
            indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
          vIdx += rows.length * 2;
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const frondPairScale = isPhone ? 0.56 : 0.70;
    const sharedFrondGeos = [
      createCurvedPalmFrondGeometry(4.0, 1.28, Math.round(36 * frondPairScale), 1, 0.64, 0.28),
      createCurvedPalmFrondGeometry(3.8, 1.18, Math.round(34 * frondPairScale), 2, 0.50, 0.36),
      createCurvedPalmFrondGeometry(4.2, 1.32, Math.round(38 * frondPairScale), 3, 0.44, 0.44),
      createCurvedPalmFrondGeometry(3.9, 1.22, Math.round(35 * frondPairScale), 4, 0.58, 0.32)
    ];
    const coconutGeo = new THREE.SphereGeometry(0.16, 10, 10);
    const coconutMat = new THREE.MeshStandardMaterial({ color: 0x5d3d1e, roughness: 0.72 });
    const skirtGeo = new THREE.CylinderGeometry(0.28, 0.16, 0.55, 10);
    const skirtMat = new THREE.MeshStandardMaterial({ color: 0x422b1a, roughness: 0.95 });
    const palmCrowns = [];

    function createPalmTree(x, z, height, leanX, leanZ, scale = 1.0, frondCount = 26) {
      const yBase = getTerrainHeight(x, z) - 0.25;
      const group = new THREE.Group();
      group.position.set(x, yBase, z);

      const h1 = Math.sin(x * 1.37 + z * 2.13);
      const h2 = Math.cos(x * 2.71 - z * 1.19);
      const h3 = Math.sin(x * 3.91 + z * 0.77);
      const dirSign = leanX >= 0 ? 1 : -1;
      const bowX = dirSign * (0.28 + 0.34 * (h1 * 0.5 + 0.5)) * scale + h2 * 0.28 * scale;
      const bowZ = h3 * 0.42 * scale;
      const midT1 = 0.28 + h2 * 0.07;
      const midT2 = 0.66 + h3 * 0.07;
      const tipX = leanX + h2 * 0.32 * scale;
      const tipZ = leanZ + h1 * 0.35 * scale;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(tipX * 0.16 - bowX * (0.35 + h3 * 0.25), height * midT1, tipZ * 0.20 + bowZ * 0.6),
        new THREE.Vector3(tipX * 0.60 + bowX * (0.30 - h1 * 0.20), height * midT2, tipZ * 0.65 - bowZ * 0.4),
        new THREE.Vector3(tipX, height, tipZ)
      ]);

      const trunkGeo = new THREE.TubeGeometry(curve, 44, 0.24 * scale, 12, false);
      const tp = trunkGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < tp.count; i++) {
        v.fromBufferAttribute(tp, i);
        const t = THREE.MathUtils.clamp(v.y / height, 0, 1);
        const cPt = curve.getPoint(t);
        const rootFlare = 0.48 * Math.exp(-t * 14.0);
        const ringRidge = Math.sin(t * 115.0) * 0.045 * (1.0 - t * 0.4);
        v.sub(cPt).multiplyScalar((1.0 - t * 0.48 + rootFlare + ringRidge)).add(cPt);
        tp.setXYZ(i, v.x, v.y, v.z);
      }
      trunkGeo.computeVertexNormals();

      const trunk = new THREE.Mesh(trunkGeo, barkMat);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const crown = new THREE.Group();
      crown.position.set(tipX, height, tipZ);
      crown.rotation.z = -dirSign * (0.04 + (h1 * 0.5 + 0.5) * 0.08);
      crown.rotation.x = h3 * 0.06;

      const collar = new THREE.Mesh(skirtGeo, skirtMat);
      collar.position.y = -0.20 * scale;
      collar.scale.setScalar(scale);
      crown.add(collar);

      const nutGeos = [];
      const nutDummy = new THREE.Object3D();
      for (let c = 0; c < 4; c++) {
        const ca = (c / 4) * Math.PI * 2;
        nutDummy.position.set(Math.cos(ca) * 0.22 * scale, -0.24 * scale, Math.sin(ca) * 0.22 * scale);
        nutDummy.scale.setScalar(scale);
        nutDummy.updateMatrix();
        const ng = coconutGeo.clone();
        ng.applyMatrix4(nutDummy.matrix);
        nutGeos.push(ng);
      }
      const mergedNuts = mergeGeometries(nutGeos, false);
      crown.add(new THREE.Mesh(mergedNuts, coconutMat));

      // 3-tier lush rounded palm crown + compact inner crown core (merged into 1 draw call per palm)
      const upperCount = Math.round(frondCount * 0.28);
      const midCount = Math.round(frondCount * 0.40);
      const lowerCount = frondCount - upperCount - midCount;
      const tierSpecs = [
        { count: upperCount, pitchMin: 0.30, pitchMax: 0.56, scaleMult: 1.00, offset: 0.0 },
        { count: midCount,   pitchMin: 0.02, pitchMax: 0.24, scaleMult: 1.00, offset: 0.23 },
        { count: lowerCount, pitchMin: -0.26, pitchMax: -0.05, scaleMult: 1.00, offset: 0.47 }
      ];

      const crownFrondGeos = [];
      const frondDummy = new THREE.Object3D();
      let fIdx = 0;
      for (const spec of tierSpecs) {
        for (let i = 0; i < spec.count; i++) {
          const frac = i / spec.count;
          const angle = (frac + spec.offset) * Math.PI * 2 + Math.sin(fIdx * 1.9 + x) * 0.14;
          const sc = (0.94 + ((fIdx * 7) % 5) * 0.03) * scale * spec.scaleMult;
          frondDummy.position.set(0, 0, 0);
          frondDummy.scale.setScalar(sc);
          frondDummy.rotation.set(
            -(spec.pitchMin + ((fIdx % 3) / 2) * (spec.pitchMax - spec.pitchMin)),
            angle,
            Math.sin(fIdx * 2.3) * 0.10
          );
          frondDummy.updateMatrix();
          const fg = sharedFrondGeos[fIdx % sharedFrondGeos.length].clone();
          fg.applyMatrix4(frondDummy.matrix);
          crownFrondGeos.push(fg);
          fIdx++;
        }
      }

      // Soft inner core fronds matching crown length so the top stays full
      for (let i = 0; i < 8; i++) {
        frondDummy.position.set(0, 0, 0);
        frondDummy.scale.setScalar(0.86 * scale);
        frondDummy.rotation.set(
          -0.68 - (i % 2) * 0.14,
          (i / 8) * Math.PI * 2 + 0.2,

        );
        frondDummy.updateMatrix();

        fg.applyMatrix4(frondDummy.matrix);
        crownFrondGeos.push(fg);
      }

      const mergedCrownGeo = mergeGeometries(crownFrondGeos, false);

    // ------------------------------------------------------------
    // 8. Real Botanicals (Cupped 5-Petal Hibiscus, True Flower Spikes, Curved Fern Ribbons, Shoreline Reeds)

    function createCurvedBroadLeafGeo() {
      const geo = new THREE.PlaneGeometry(0.66, 1.55, 6, 10);
      geo.translate(0, 0.775, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = Math.max(0, z / 1.55);
        const archY = Math.sin(t * Math.PI * 0.85) * 0.22 - t * t * 0.35;
        const foldY = Math.abs(x) * 0.18;
        pos.setY(i, archY + foldY);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function createCurvedFernGeo() {
      const geo = new THREE.PlaneGeometry(0.95, 1.95, 4, 14);
      geo.translate(0, 0.975, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = Math.max(0, z / 1.95);
        const archY = Math.sin(t * Math.PI * 0.65) * 0.34 - Math.pow(t, 1.9) * 0.72;
        const droop = Math.abs(x) * 0.10;
        pos.setY(i, archY - droop);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // Cupped single petal geometry (subdivided curved mesh, not a flat triangle)
    function createCuppedPetalGeo() {
      const geo = new THREE.PlaneGeometry(0.18, 0.22, 4, 5);
      geo.translate(0, 0.11, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = z / 0.22;
        const cup = Math.sin(t * Math.PI * 0.85) * 0.055 - (x * x) * 1.4;
        const ruffle = Math.sin(x * 38.0) * 0.008 * t;
        pos.setY(i, cup + ruffle);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const broadLeafGeo = createCurvedBroadLeafGeo();
    const fernRibbonGeo = createCurvedFernGeo();
    const cuppedPetalGeo = createCuppedPetalGeo();
    const stemGeo = new THREE.CylinderGeometry(0.012, 0.018, 0.55, 6);

    const floretGeo = new THREE.ConeGeometry(0.026, 0.068, 5);
    floretGeo.rotateX(Math.PI * 0.36);
    floretGeo.translate(0, 0, 0.032);

    const petalMats = [
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#542320', '#a6574c', '#d48d7b'), bumpMap: broadLeafTex.bumpMap, bumpScale: 0.025, alphaTest: 0.35, roughness: 0.42, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#623626', '#ba7a58', '#dfb08c'), bumpMap: broadLeafTex.bumpMap, bumpScale: 0.025, alphaTest: 0.35, roughness: 0.42, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#542937', '#a25c6b', '#cf96a2'), bumpMap: broadLeafTex.bumpMap, bumpScale: 0.025, alphaTest: 0.35, roughness: 0.42, side: THREE.DoubleSide })
    ];
    const purpleFloretMat = new THREE.MeshStandardMaterial({ color: 0x827a9c, emissive: 0x0e0b16, roughness: 0.78 });
    const purpleBudMat    = new THREE.MeshStandardMaterial({ color: 0x9890b2, emissive: 0x100d1a, roughness: 0.78 });

    // Slender shoreline grass/reed blades
    const grassGeo = new THREE.PlaneGeometry(0.045, 0.85, 1, 6);
    grassGeo.translate(0, 0.425, 0);
    const gp = grassGeo.attributes.position;
    for (let i = 0; i < gp.count; i++) {
      const y = gp.getY(i);
      const t = y / 0.85;
      gp.setX(i, gp.getX(i) * (1.0 - t * 0.88));
      gp.setZ(i, t * t * 0.24);
    }
    grassGeo.computeVertexNormals();
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x7c924e, roughness: 0.58, side: THREE.DoubleSide });
    applyFoliageSSS(grassMat, 0.45);

    let seed = 108;
    function rand() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    // Batch static botanical geometries by material so the entire lush oasis renders in ~10 draw calls
    const geoBuckets = new Map();
    const dummyObj = new THREE.Object3D();
    function pushGeo(mat, baseGeo, pos, rot, scale, parentMat4 = null) {
      let arr = geoBuckets.get(mat);
      if (!arr) { arr = []; geoBuckets.set(mat, arr); }
      const g = baseGeo.clone();
      dummyObj.position.copy(pos);
      dummyObj.rotation.copy(rot);
      dummyObj.scale.copy(scale);
      dummyObj.updateMatrix();
      if (parentMat4) {
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(parentMat4, dummyObj.matrix));
      } else {
        g.applyMatrix4(dummyObj.matrix);
      }
      arr.push(g);
    }

    const vZero = new THREE.Vector3();
    const eZero = new THREE.Euler();
    const sOne  = new THREE.Vector3(1, 1, 1);

    function addHibiscusToBuckets(pMat, worldMat) {
      for (let p = 0; p < 5; p++) {
        pushGeo(
          pMat,
          cuppedPetalGeo,
          vZero,
          new THREE.Euler(0.08 + p * 0.015, (p / 5) * Math.PI * 2 + (rand() - 0.5) * 0.12, 0),
          sOne,
          worldMat
        );
      }
      pushGeo(pistilMat, pistilGeo, vZero, new THREE.Euler(0.15, 0, 0), sOne, worldMat);
    }

    function addPurpleSpikeToBuckets(scale, worldMat) {
      pushGeo(stemMat, stemGeo, vZero, eZero, new THREE.Vector3(0.8 * scale, 1.45 * scale, 0.8 * scale), worldMat);
      const florets = 18;
      for (let i = 0; i < florets; i++) {
        const t = i / (florets - 1);
        const a = i * 2.39996;
        const r = (0.045 - t * 0.025) * scale;
        const sc = (1.05 - t * 0.55) * scale;
        pushGeo(
          t > 0.7 ? purpleBudMat : purpleFloretMat,
          floretGeo,
          new THREE.Vector3(Math.cos(a) * r, (0.34 + t * 0.44) * scale, Math.sin(a) * r),
          new THREE.Euler(0, -a, 0),
          new THREE.Vector3(sc, sc, sc),
          worldMat
        );
      }
    }

    const placedBotanicalPts = [];
    function canPlaceBotanical(wx, wz, minDist) {
      for (let i = 0; i < placedBotanicalPts.length; i++) {
        const dx = wx - placedBotanicalPts[i][0];
        const dz = wz - placedBotanicalPts[i][1];
        if (dx * dx + dz * dz < minDist * minDist) return false;
      }
      placedBotanicalPts.push([wx, wz]);
      return true;
    }

    function addLushBankCluster(cx, cz, radius, count, fernBias = 0.5, scaleBoost = 1.0) {
      const baseY = getTerrainHeight(cx, cz) - 0.10;
      const clusterMat = new THREE.Matrix4().makeTranslation(cx, baseY, cz);
      const tmpObj = new THREE.Object3D();

      for (let i = 0; i < count; i++) {
        const a = rand() * Math.PI * 2;
        const r = rand() * radius;
        const lx = Math.cos(a) * r;
        const lz = Math.sin(a) * r;
        if (!canPlaceBotanical(cx + lx, cz + lz, 0.42)) continue;

        const leaves = 6 + Math.floor(rand() * 4);
        for (let b = 0; b < leaves; b++) {
          const s = (0.78 + rand() * 0.65) * scaleBoost;
          pushGeo(
            rand() > 0.42 ? broadLeafMat : broadLeafLightMat,
            broadLeafGeo,
            new THREE.Vector3(lx, 0, lz),
            new THREE.Euler(-0.32 - rand() * 0.45, (b / leaves) * Math.PI * 2 + rand() * 0.4, 0),
            new THREE.Vector3(s, s, s),
            clusterMat
          );
        }

        if (rand() < fernBias) {
          const fCount = 5 + Math.floor(rand() * 4);
          for (let f = 0; f < fCount; f++) {
            const fs = (0.76 + rand() * 0.45) * scaleBoost;
            pushGeo(
              fernMat,
              fernRibbonGeo,
              new THREE.Vector3(lx, 0.08, lz),
              new THREE.Euler(-0.24 - rand() * 0.25, (f / fCount) * Math.PI * 2 + rand() * 0.35, 0),
              new THREE.Vector3(fs, fs, fs),
              clusterMat
            );
          }
        }

        if (rand() > 0.22) {
          if (rand() < 0.36) {
            tmpObj.position.set(lx + (rand() - 0.5) * 0.25, 0.08, lz + (rand() - 0.5) * 0.25);
            tmpObj.rotation.set((rand() - 0.5) * 0.22, rand() * Math.PI * 2, (rand() - 0.5) * 0.22);
            tmpObj.scale.set(1, 1, 1);
            tmpObj.updateMatrix();
            addPurpleSpikeToBuckets((1.05 + rand() * 0.45) * scaleBoost, new THREE.Matrix4().multiplyMatrices(clusterMat, tmpObj.matrix));
          } else {
            const pMat = petalMats[Math.floor(rand() * petalMats.length)];
            const blossoms = 2 + Math.floor(rand() * 3);
            for (let k = 0; k < blossoms; k++) {
              const bx = lx + (rand() - 0.5) * 0.45;
              const bz = lz + (rand() - 0.5) * 0.45;
              const hScale = (0.85 + rand() * 0.60) * scaleBoost;
              tmpObj.position.set(bx, 0, bz);
              tmpObj.rotation.set((rand() - 0.5) * 0.35, rand() * Math.PI * 2, (rand() - 0.5) * 0.35);
              tmpObj.scale.set(1, hScale, 1);
              tmpObj.updateMatrix();
              const stemWorld = new THREE.Matrix4().multiplyMatrices(clusterMat, tmpObj.matrix);
              pushGeo(stemMat, stemGeo, vZero, eZero, sOne, stemWorld);

              const bScale = (0.98 + rand() * 0.50) * scaleBoost / hScale;
              tmpObj.position.set(0, 0.54, 0);
              tmpObj.rotation.set(0.35 + (rand() - 0.5) * 0.4, 0, 0);
              tmpObj.scale.set(bScale, bScale, bScale);
              tmpObj.updateMatrix();
              addHibiscusToBuckets(pMat, new THREE.Matrix4().multiplyMatrices(stemWorld, tmpObj.matrix));
            }
          }
        }
      }
    }

    const bankSpots = [
      [-11.6, 4.4, 2.3, 16, 0.65, 1.20], [-12.2, 1.0, 2.4, 16, 0.60, 1.20], [-11.2, -2.4, 2.2, 14, 0.60, 1.15],

    addAgaveRosette(1.35, 14.3, 0.92);

    // Layer 2: Dry golden desert scrub & grass tufts bridging lush banks to outer sand
    const dryGrassMat = new THREE.MeshStandardMaterial({
      color: 0xc2a15c,
      roughness: 0.82,

    });
    applyFoliageSSS(dryGrassMat, 0.42);
    const dryScrubSpots = [
      [-12.8, 6.2], [-13.4, 2.4], [-11.8, -4.8], [-8.8, -6.6],

    ];
    for (const [dx, dz] of dryScrubSpots) {
      const dy = getTerrainHeight(dx, dz) - 0.04;
      for (let b = 0; b < 9; b++) {
        const sc = 0.55 + rand() * 0.65;
        pushGeo(
          dryGrassMat,
          grassGeo,
          new THREE.Vector3(dx + (rand() - 0.5) * 0.8, dy, dz + (rand() - 0.5) * 0.8),
          new THREE.Euler((rand() - 0.5) * 0.55, rand() * Math.PI * 2, (rand() - 0.5) * 0.35),
          new THREE.Vector3(sc, sc * 0.82, sc)
        );
      }
    }

    for (const [mat, geos] of geoBuckets.entries()) {
      const merged = mergeGeometries(geos, false);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    // ------------------------------------------------------------
    // 9. Shoreline Stones & Ambient Life (screen-space sun-shafts handle rays with zero overdraw)
    // ------------------------------------------------------------

    // Smooth sun-warmed oasis shoreline stones
    const stoneGeo = new THREE.DodecahedronGeometry(0.14, 1);
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.88, metalness: 0.02 });
    stoneMat.onBeforeCompile = (shader) => {
      shader.uniforms.uStoneTime = terrainTimeUniform;
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vStoneWorldPos;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvec4 swp = modelMatrix * instanceMatrix * vec4(transformed, 1.0);\nvStoneWorldPos = swp.xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vStoneWorldPos;\nuniform float uStoneTime;')
        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
  float stoneWet = smoothstep(0.14, 0.0, vStoneWorldPos.y);
  roughnessFactor = mix(roughnessFactor, 0.18, stoneWet * 0.85);`)
        .replace('#include <dithering_fragment>', `{
  float stoneWetRing = smoothstep(0.14, -0.02, vStoneWorldPos.y);
  gl_FragColor.rgb *= mix(1.0, 0.58, stoneWetRing);
  float cStone = sin(vStoneWorldPos.x * 7.5 + uStoneTime * 1.6 + sin(vStoneWorldPos.z * 6.5 - uStoneTime)) * 0.5 + 0.5;
  cStone = pow(cStone, 2.8);
  float bounceZone = smoothstep(0.22, 0.0, vStoneWorldPos.y);
  gl_FragColor.rgb += vec3(0.22, 0.42, 0.36) * cStone * bounceZone * 0.45;
}
#include <dithering_fragment>`);
    };
    const stoneInst = new THREE.InstancedMesh(stoneGeo, stoneMat, 48);
    stoneInst.castShadow = true;
    stoneInst.receiveShadow = true;
    const stonePalette = [
      new THREE.Color(0xb89674),
      new THREE.Color(0x9c7c5e),
      new THREE.Color(0xc9a882),
      new THREE.Color(0x88705c)
    ];
    const stoneDummy = new THREE.Object3D();
    const placedWaterPts = [];
    function canPlaceWaterObj(wx, wz, minDist) {
      for (let i = 0; i < placedWaterPts.length; i++) {
        const dx = wx - placedWaterPts[i][0];
        const dz = wz - placedWaterPts[i][1];
        if (dx * dx + dz * dz < minDist * minDist) return false;
      }
      placedWaterPts.push([wx, wz]);
      return true;
    }
    let contactIdx = 0;
    let stoneCount = 0;
    for (let i = 0; i < 48; i++) {
      const ang = (i / 48) * Math.PI * 2 + rand() * 0.20;
      if (Math.sin(ang) > 0.35 && Math.abs(Math.cos(ang)) < 0.65) continue;
      if (Math.sin(ang) < -0.50 && Math.abs(Math.cos(ang)) < 0.55) continue;
      const rad = 0.99 + rand() * 0.08;
      const sx = Math.cos(ang) * 12.6 * rad;
      const sz = 0.6 + Math.sin(ang) * 8.3 * rad;
      if (!canPlaceWaterObj(sx, sz, 0.52)) continue;
      const sy = getTerrainHeight(sx, sz) - 0.03;
      stoneDummy.position.set(sx, sy, sz);
      stoneDummy.rotation.set(rand() * 0.35, rand() * Math.PI * 2, rand() * 0.35);
      stoneDummy.scale.set(0.65 + rand() * 0.95, 0.28 + rand() * 0.24, 0.65 + rand() * 0.90);
      stoneDummy.updateMatrix();
      stoneInst.setMatrixAt(stoneCount, stoneDummy.matrix);
      stoneInst.setColorAt(stoneCount, stonePalette[i % stonePalette.length]);
      stoneCount++;
      if (sy < 0.08 && contactIdx < 8) {
        waterContactPts[contactIdx++].set(sx, sz, 0.16);
      }
    }
    stoneInst.count = stoneCount;
    stoneInst.instanceColor.needsUpdate = true;
    scene.add(stoneInst);

    // Layer 1: Submerged river stones on the shallow underwater sandbed
    const subStoneInst = new THREE.InstancedMesh(stoneGeo, stoneMat, 14);
    subStoneInst.receiveShadow = true;
    let subStoneCount = 0;
    for (let i = 0; i < 14; i++) {
      const ang = (i / 14) * Math.PI * 2 + rand() * 0.35;
      if (Math.sin(ang) > 0.25 && Math.abs(Math.cos(ang)) < 0.72) continue;
      if (Math.sin(ang) < -0.50 && Math.abs(Math.cos(ang)) < 0.55) continue;
      const sx = Math.cos(ang) * (8.4 + rand() * 2.6);
      const sz = 0.6 + Math.sin(ang) * (5.2 + rand() * 2.0);
      if (!canPlaceWaterObj(sx, sz, 0.55)) continue;
      const sy = getTerrainHeight(sx, sz) - 0.02;
      stoneDummy.position.set(sx, Math.min(sy, -0.05), sz);
      stoneDummy.rotation.set(rand() * 0.25, rand() * Math.PI * 2, rand() * 0.25);
      stoneDummy.scale.set(0.8 + rand() * 0.9, 0.25 + rand() * 0.18, 0.8 + rand() * 0.9);
      stoneDummy.updateMatrix();
      subStoneInst.setMatrixAt(subStoneCount, stoneDummy.matrix);
      subStoneInst.setColorAt(subStoneCount, stonePalette[(i + 1) % stonePalette.length]);
      subStoneCount++;
      if (contactIdx < 10) {
        waterContactPts[contactIdx++].set(sx, sz, 0.18);
      }
    }
    subStoneInst.count = subStoneCount;
    subStoneInst.instanceColor.needsUpdate = true;
    scene.add(subStoneInst);

    // Floating fallen hibiscus petals & olive leaves resting on the calm water edge
    const floaters = [];
    const floaterGeo = new THREE.CircleGeometry(0.055, 6);
    floaterGeo.scale(1.5, 0.75, 1.0);
    floaterGeo.rotateX(-Math.PI / 2);
    const floaterMats = [
      new THREE.MeshStandardMaterial({ color: 0xd9846c, roughness: 0.58, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      new THREE.MeshStandardMaterial({ color: 0x9aa854, roughness: 0.58, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }),
      new THREE.MeshStandardMaterial({ color: 0xe8b288, roughness: 0.58, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 })
    ];
    floaterMats.forEach((fm) => applyFoliageSSS(fm, 0.55));
    for (let i = 0; i < 16; i++) {
      const a = rand() * Math.PI * 2;
      const r = 0.78 + rand() * 0.16;
      const fx = Math.cos(a) * 11.8 * r;
      const fz = 0.6 + Math.sin(a) * 7.8 * r;
      if (!canPlaceWaterObj(fx, fz, 0.35)) continue;
      const fm = new THREE.Mesh(floaterGeo, floaterMats[i % floaterMats.length]);
      fm.position.set(fx, 0.036, fz);
      fm.rotation.y = rand() * Math.PI * 2;
      fm.scale.setScalar(0.75 + rand() * 0.7);
      scene.add(fm);
      floaters.push({ mesh: fm, baseX: fx, baseZ: fz, phase: rand() * Math.PI * 2 });
      if (contactIdx < 12) {
        waterContactPts[contactIdx++].set(fx, fz, 0.07);
      }
    }

    // Delicate golden-hour butterflies near the flowers & shoreline
    const flyers = [];
    const flyerMat = new THREE.MeshBasicMaterial({ color: 0xf4bd74, side: THREE.DoubleSide, transparent: true, opacity: 0.72 });
    const wingGeo = new THREE.CircleGeometry(0.036, 3);
    for (let i = 0; i < 5; i++) {
      const fGroup = new THREE.Group();
      const wL = new THREE.Mesh(wingGeo, flyerMat);
      const wR = new THREE.Mesh(wingGeo, flyerMat);
      wL.position.x = -0.022;
      wR.position.x = 0.022;
      fGroup.add(wL, wR);
      const basePos = new THREE.Vector3((rand() - 0.5) * 11, 0.48 + rand() * 0.9, 1.5 + rand() * 7.5);
      fGroup.position.copy(basePos);
      scene.add(fGroup);
      flyers.push({ group: fGroup, wL, wR, base: basePos, phase: rand() * Math.PI * 2, speed: 0.75 + rand() * 0.6 });
    }

    // Tiny distant desert swallows gliding high in the golden-hour sky
    const birds = [];
    const birdMat = new THREE.MeshBasicMaterial({ color: 0x5c4654, side: THREE.DoubleSide, transparent: true, opacity: 0.72 });
    const birdWingGeo = new THREE.PlaneGeometry(0.24, 0.055);
    for (let i = 0; i < 4; i++) {
      const bGroup = new THREE.Group();
      const bL = new THREE.Mesh(birdWingGeo, birdMat);
      const bR = new THREE.Mesh(birdWingGeo, birdMat);
      bL.position.x = -0.11;
      bR.position.x = 0.11;
      bL.rotation.z = 0.22;
      bR.rotation.z = -0.22;
      bGroup.add(bL, bR);
      const bBase = new THREE.Vector3(3.5 + i * 2.2 + rand() * 1.4, 11.2 + rand() * 2.4, -36 - rand() * 8);
      bGroup.position.copy(bBase);
      scene.add(bGroup);
      birds.push({ group: bGroup, bL, bR, base: bBase, phase: rand() * Math.PI * 2 });
    }

    // Low-lying drifting oasis mist / fog layers over water & dune base
    const mistMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
          return v;
        }
        void main() {
          vec2 centered = vUv - 0.5;
          float radial = smoothstep(0.48, 0.02, length(centered)) * smoothstep(-0.48, 0.12, centered.y);
          float n = fbm(vUv * vec2(2.6, 1.8) + vec2(uTime * 0.022, -uTime * 0.008));
          float alpha = radial * smoothstep(0.28, 0.82, n) * 0.042;
          gl_FragColor = vec4(0.98, 0.89, 0.80, alpha);
        }
      `
    });
    const mistConfigs = [
      { x:  0.0, y: 3.4, z: -18.0, w: 34, d: 8,  rx: -Math.PI * 0.16 },
      { x:  0.0, y: 6.8, z: -44.0, w: 52, d: 10, rx: -Math.PI * 0.10 }
    ];
    for (const mc of mistConfigs) {
      const mMesh = new THREE.Mesh(new THREE.PlaneGeometry(mc.w, mc.d), mistMat);
      mMesh.position.set(mc.x, mc.y, mc.z);
      mMesh.rotation.x = mc.rx;
      scene.add(mMesh);
    }

    // Fine Floating Golden Dust Particles
    const moteCount = 380;
    const motePos = new Float32Array(moteCount * 3);
    const motePhase = new Float32Array(moteCount);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3]     = (rand() - 0.5) * 26;
      motePos[i * 3 + 1] = 0.25 + rand() * 7.5;
      motePos[i * 3 + 2] = -8 + rand() * 21;
      motePhase[i] = rand() * Math.PI * 2;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    moteGeo.setAttribute('aPhase', new THREE.BufferAttribute(motePhase, 1));

    const moteMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uPointerWorld: { value: new THREE.Vector3(999, 999, 999) },
        uPointerStrength: { value: 0.0 }
      },
      vertexShader: `
        attribute float aPhase;
        uniform float uTime;
        uniform vec3 uPointerWorld;
        uniform float uPointerStrength;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          p.y += sin(uTime * 0.45 + aPhase) * 0.28;
          p.x += cos(uTime * 0.30 + aPhase * 1.3) * 0.25;
          vec3 toP = p - uPointerWorld;
          float dP = length(toP);
          if (dP < 4.5 && dP > 0.001) {
            float push = (1.0 - dP / 4.5) * uPointerStrength;
            p += normalize(toP) * push * 0.65;
            p.y += push * 0.35;
          }
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (16.5 / -mv.z) * (0.65 + 0.35 * sin(uTime * 1.6 + aPhase));
          vAlpha = 0.38 + 0.36 * sin(uTime * 1.3 + aPhase);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float glow = pow(1.0 - d * 2.0, 2.4);
          gl_FragColor = vec4(1.0, 0.92, 0.74, glow * vAlpha);
        }
      `
    });
    scene.add(new THREE.Points(moteGeo, moteMat));

    // ------------------------------------------------------------
    // 10. Interactive Hover / Touch Scrub, Procedural Web Audio & Animation Loop
    // ------------------------------------------------------------
    let audioCtx = null;
    let waterGain = null;
    let waterFilter = null;
    let lastDropTime = 0;

    function initAmbientAudio() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();

      // 3-second seamless pink-ish noise buffer
      const bufSize = audioCtx.sampleRate * 3;
      const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + white * 0.029;
        b1 = 0.985 * b1 + white * 0.032;
        b2 = 0.950 * b2 + white * 0.048;
        data[i] = (b0 + b1 + b2 + white * 0.06) * 0.35;
      }

      // Layer 1: Desert breeze & palm frond rustle
      const windSrc = audioCtx.createBufferSource();
      windSrc.buffer = noiseBuf;
      windSrc.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 340;
      windFilter.Q.value = 0.85;
      const windGain = audioCtx.createGain();
      windGain.gain.value = 0.06;
      const windLfo = audioCtx.createOscillator();
      windLfo.frequency.value = 0.14;
      const windLfoGain = audioCtx.createGain();
      windLfoGain.gain.value = 140;
      windLfo.connect(windLfoGain).connect(windFilter.frequency);
      windSrc.connect(windFilter).connect(windGain).connect(audioCtx.destination);
      windSrc.start();
      windLfo.start();

      // Layer 2: Calm oasis pond lapping water (brightens on hover/scrub)
      const waterSrc = audioCtx.createBufferSource();
      waterSrc.buffer = noiseBuf;
      waterSrc.loop = true;
      waterFilter = audioCtx.createBiquadFilter();
      waterFilter.type = 'bandpass';
      waterFilter.frequency.value = 720;
      waterFilter.Q.value = 1.6;
      waterGain = audioCtx.createGain();
      waterGain.gain.value = 0.035;
      waterSrc.connect(waterFilter).connect(waterGain).connect(audioCtx.destination);
      waterSrc.start();
    }

    function playWaterDroplet(pitchFactor = 1.0) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const now = audioCtx.currentTime;
      if (now - lastDropTime < 0.14) return;
      lastDropTime = now;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      const baseF = 520 + pitchFactor * 360;
      osc.frequency.setValueAtTime(baseF, now);
      osc.frequency.exponentialRampToValueAtTime(baseF * 1.65, now + 0.09);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.035, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0005, now + 0.16);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    }

    const pointerNdc = new THREE.Vector2(99, 99);
    const pointerRaycaster = new THREE.Raycaster();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.02);
    const pointerWorld = new THREE.Vector3(999, 0.02, 999);
    const pointerSmooth = new THREE.Vector3(999, 0.02, 999);
    let pointerTargetStrength = 0;
    let pointerStrength = 0;

    function updatePointerFromEvent(clientX, clientY, playDrop = false) {
      pointerNdc.x = (clientX / window.innerWidth) * 2 - 1;
      pointerNdc.y = -(clientY / window.innerHeight) * 2 + 1;
      pointerRaycaster.setFromCamera(pointerNdc, camera);
      const hit = new THREE.Vector3();
      if (pointerRaycaster.ray.intersectPlane(waterPlane, hit)) {
        pointerWorld.copy(hit);
        const rPond = Math.hypot(hit.x / 12.2, (hit.z - 0.6) / 8.2);
        if (playDrop && rPond < 1.0) playWaterDroplet(Math.random());
      } else {
        pointerRaycaster.ray.at(16.0, pointerWorld);
      }
      pointerTargetStrength = 1.0;
    }

    renderer.domElement.addEventListener('pointermove', (e) => {
      updatePointerFromEvent(e.clientX, e.clientY, true);
    }, { passive: true });
    renderer.domElement.addEventListener('pointerdown', (e) => {
      initAmbientAudio();
      updatePointerFromEvent(e.clientX, e.clientY, true);
    }, { passive: true });
    renderer.domElement.addEventListener('touchstart', () => {
      initAmbientAudio();
    }, { passive: true });
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updatePointerFromEvent(e.touches[0].clientX, e.touches[0].clientY, true);
      }
    }, { passive: true });
    renderer.domElement.addEventListener('pointerleave', () => {
      pointerTargetStrength = 0;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      pointerTargetStrength *= 0.965;
      pointerStrength += (pointerTargetStrength - pointerStrength) * 0.14;
      pointerSmooth.lerp(pointerWorld, 0.18);

      if (waterGain && waterFilter) {
        waterGain.gain.value = 0.035 + pointerStrength * 0.045;
        waterFilter.frequency.value = 720 + pointerStrength * 520;
      }

      skyMat.uniforms.uTime.value = t;
      terrainTimeUniform.value = t;
      waterReflector.material.uniforms.uTime.value = t;
      waterReflector.material.uniforms.uPointerPos.value.set(pointerSmooth.x, pointerSmooth.z);
      waterReflector.material.uniforms.uPointerStrength.value = pointerStrength;
      moteMat.uniforms.uTime.value = t;
      moteMat.uniforms.uPointerWorld.value.copy(pointerSmooth);
      moteMat.uniforms.uPointerStrength.value = pointerStrength;
      mistMat.uniforms.uTime.value = t;
      animeFilmicPass.uniforms.uTime.value = t;

      for (const fl of flyers) {
        let fx = fl.base.x + Math.sin(t * fl.speed + fl.phase) * 0.85;
        let fy = fl.base.y + Math.sin(t * fl.speed * 1.7 + fl.phase) * 0.16;
        let fz = fl.base.z + Math.cos(t * fl.speed * 0.8 + fl.phase) * 0.75;
        const dx = fx - pointerSmooth.x;
        const dz = fz - pointerSmooth.z;
        const dist = Math.hypot(dx, dz);
        let flapBoost = 0;
        if (dist < 4.0 && dist > 0.01) {
          const push = (1.0 - dist / 4.0) * pointerStrength;
          fx += (dx / dist) * push * 1.1;
          fz += (dz / dist) * push * 1.1;
          fy += push * 0.55;
          flapBoost = push * 14.0;
        }
        fl.group.position.set(fx, fy, fz);
        const flap = Math.sin(t * (22.0 + flapBoost) + fl.phase) * 0.65;
        fl.wL.rotation.z = flap;
        fl.wR.rotation.z = -flap;
      }

      for (const ft of floaters) {
        let fx = ft.baseX + Math.sin(t * 0.25 + ft.phase) * 0.06;
        let fz = ft.baseZ + Math.cos(t * 0.20 + ft.phase) * 0.05;
        const dx = fx - pointerSmooth.x;
        const dz = fz - pointerSmooth.z;
        const pDist = Math.hypot(dx, dz);
        let pWave = 0;
        if (pDist < 4.5 && pDist > 0.001) {
          const push = Math.exp(-pDist * 0.95) * pointerStrength;
          fx += (dx / pDist) * push * 0.28;
          fz += (dz / pDist) * push * 0.28;
          pWave = Math.sin(pDist * 10.0 - t * 8.0) * push * 0.018;
        }
        const rNorm = Math.hypot(fx / 12.2, (fz - 0.6) / 8.2);
        const shoreDamp = THREE.MathUtils.smoothstep(1.02 - rNorm, 0.0, 0.47);
        const waveY = (Math.sin(fx * 0.65 + fz * 0.40 - t * 0.85) * 0.011 + Math.cos(fx * 0.48 - fz * 0.78 - t * 0.65) * 0.008 + Math.sin(fz * 1.45 + fx * 0.30 - t * 1.15) * 0.004 + pWave) * shoreDamp;
        ft.mesh.position.set(fx, 0.032 + waveY, fz);
        ft.mesh.rotation.x = Math.cos(fz * 1.45 - t * 1.15) * 0.04 * shoreDamp;
        ft.mesh.rotation.z = Math.sin(fx * 0.65 - t * 0.85) * 0.04 * shoreDamp;
        ft.mesh.rotation.y += 0.0008 + pointerStrength * 0.003;
      }

      for (const b of birds) {
        b.group.position.x = b.base.x - Math.sin(t * 0.14 + b.phase) * 2.4;
        b.group.position.y = b.base.y + Math.sin(t * 0.35 + b.phase) * 0.25;
        const flap = 0.22 + Math.sin(t * 5.2 + b.phase) * 0.28;
        b.bL.rotation.z = flap;
        b.bR.rotation.z = -flap;
      }

      for (const item of palmCrowns) {
        const cPos = item.crown.getWorldPosition(new THREE.Vector3());
        const dx = cPos.x - pointerSmooth.x;
        const dz = cPos.z - pointerSmooth.z;
        const pDist = Math.hypot(dx, dz);
        const breeze = pDist < 9.0 ? (1.0 - pDist / 9.0) * pointerStrength * 0.045 : 0;
        item.crown.rotation.z = Math.sin(t * 0.85 + item.phase) * 0.025 + Math.sign(dx) * breeze;
        item.crown.rotation.x = Math.cos(t * 0.65 + item.phase) * 0.018 + Math.sign(dz) * breeze * 0.6;
      }

      controls.update();
      const sunProj = sunDir.clone().multiplyScalar(120).project(camera);
      animeFilmicPass.uniforms.uSunScreenPos.value.set(sunProj.x * 0.5 + 0.5, sunProj.y * 0.5 + 0.5);
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
