<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden-Hour Desert Oasis — Three.js 0.187.0 WebGL2 + Framer Motion 14.14</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1210;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8efe6;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .scrub-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(26, 17, 22, 0.48);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(241, 198, 130, 0.28);
      box-shadow: 0 6px 24px rgba(18, 10, 14, 0.32);
      touch-action: none;
    }
    .sound-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(241, 198, 130, 0.14);
      color: #f8efe6;
      border: 1px solid rgba(241, 198, 130, 0.34);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .sound-btn.on {
      background: rgba(241, 198, 130, 0.28);
      border-color: rgba(241, 198, 130, 0.72);
    }
    .scrub-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10.5px;
      color: rgba(248, 239, 230, 0.85);
      letter-spacing: 0.02em;
    }
    .scrub-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 112px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e5935c 0%, #f1c682 50%, #c89bb6 100%);
      outline: none;
      cursor: ew-resize;
      touch-action: none;
    }
    .scrub-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff6e8;
      border: 2px solid #d99b56;
      box-shadow: 0 0 8px rgba(241, 198, 130, 0.75);
    }
    .scrub-hint {
      font-size: 10px;
      color: rgba(248, 239, 230, 0.58);
      border-left: 1px solid rgba(241, 198, 130, 0.22);
      padding-left: 8px;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .scrub-hint { display: none; }
      .scrub-slider { width: 88px; }
    }
    .hud-pill {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(24, 16, 13, 0.52);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(241, 198, 130, 0.30);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      letter-spacing: 0.02em;
      cursor: pointer;
      color: #f5e6d3;
    }
    .hud-panel {
      position: fixed;
      top: 54px;
      right: 14px;
      z-index: 20;
      width: 268px;
      background: rgba(22, 14, 12, 0.74);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(241, 198, 130, 0.28);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
    }
    .hud-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #f1c682;
      margin-bottom: 10px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .preset-btn {
      background: rgba(255, 232, 200, 0.08);
      border: 1px solid rgba(241, 198, 130, 0.2);
      color: #f5e6d3;
      border-radius: 10px;
      padding: 7px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
    }
    .preset-btn.active {
      background: rgba(241, 198, 130, 0.26);
      border-color: rgba(241, 198, 130, 0.75);
      color: #fff6e8;
    }
    .slider-row { margin-bottom: 10px; }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #d9c5b2;
      margin-bottom: 4px;
    }
    input[type="range"] { width: 100%; accent-color: #e8b161; cursor: pointer; }
    .badge-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: rgba(245, 230, 211, 0.68);
      border-top: 1px solid rgba(241, 198, 130, 0.16);
      padding-top: 8px;
      margin-top: 4px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/",
        "framer-motion": "https://esm.sh/framer-motion@14.14.0?external=react,react-dom"
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
