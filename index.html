<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desert Oasis — Golden Hour (Three.js)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #14101a; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(18, 14, 24, 0.45);
      color: rgba(255, 244, 228, 0.88);
      font: 12px/1.4 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.03em;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div id="hint">Drag to orbit · Scroll to zoom</div>
  <script>
    window.addEventListener('error', (e) => {
      const h = document.getElementById('hint');
      if (h) h.textContent = 'ERR: ' + e.message + ' (' + e.lineno + ')';
    });
    window.addEventListener('unhandledrejection', (e) => {
      const h = document.getElementById('hint');
      if (h) h.textContent = 'REJ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // ------------------------------------------------------------
    // 1. Renderer, Scene, Camera & Post-Processing
    // ------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xe8bfa0, 0.0052);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.15,
      450
    );
    camera.position.set(0, 3.15, 17.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.98;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.15,
      0.65,
      0.86
    );
    composer.addPass(bloomPass);

    const animeFilmicPass = new ShaderPass({
      uniforms: {
        tDiffuse: { value: null },
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        varying vec2 vUv;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
        }

        void main() {
          vec4 tex = texture2D(tDiffuse, vUv);
          vec3 col = tex.rgb;

          // Clean photographic golden-hour filmic curve (no milky wash)
          float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
          vec3 highlightTint = vec3(1.03, 0.99, 0.93);
          col = mix(col, col * highlightTint, smoothstep(0.25, 0.85, lum));

          // Subtle natural filmic contrast
          col = col * col * (3.0 - 2.0 * col) * 0.14 + col * 0.86;

          // Subtle vignette + warm upper-left sun glow
          vec2 d = vUv - 0.5;
          float vig = 1.0 - dot(d, d) * 0.24;
          col *= vig;
          vec2 sunUv = vec2(0.26, 0.82);
          float halo = exp(-length((vUv - sunUv) * vec2(1.0, 1.7)) * 4.2);
          col += vec3(1.0, 0.88, 0.68) * halo * 0.08;

          // Fine 35mm grain
          float grain = (hash(vUv * 1200.0 + fract(uTime) * 37.0) - 0.5) * 0.012;
          col += grain;

          gl_FragColor = vec4(clamp(col, 0.0, 1.0), tex.a);
        }
      `
    });
    composer.addPass(animeFilmicPass);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, -4.0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.minDistance = 4.5;
    controls.maxDistance = 48;
    controls.update();

    // ------------------------------------------------------------
    // 2. Golden-Hour Lighting (Low Sun from Left -> Sculpted Slip-Faces)
    // ------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xd4a8c4, 0xd49c66, 0.92);
    scene.add(hemiLight);

    const sunDir = new THREE.Vector3(-72, 22, -22).normalize();
    const sunLight = new THREE.DirectionalLight(0xffd496, 3.1);
    sunLight.position.copy(sunDir).multiplyScalar(95);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 220;
    sunLight.shadow.camera.left = -64;
    sunLight.shadow.camera.right = 64;
    sunLight.shadow.camera.top = 52;
    sunLight.shadow.camera.bottom = -52;
    sunLight.shadow.bias = -0.00035;
    scene.add(sunLight);

    const bounceLight = new THREE.DirectionalLight(0xffcfa0, 0.95);
    bounceLight.position.set(18, 12, 32);
    scene.add(bounceLight);

    // ------------------------------------------------------------
    // 3. Sky Dome & Soft Golden-Hour Cumulus Clouds
    // ------------------------------------------------------------
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uTime: { value: 0 },
        uSunDir: { value: sunDir }
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec3 vWorldPos;
        uniform float uTime;
        uniform vec3 uSunDir;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x),
            f.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p = rot * p * 2.04;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec3 dir = normalize(vWorldPos);
          float h = clamp(dir.y, 0.0, 1.0);

          vec3 horizon = vec3(1.00, 0.81, 0.62);
          vec3 roseMid = vec3(0.88, 0.68, 0.74);
          vec3 zenith  = vec3(0.42, 0.50, 0.76);

          vec3 col = mix(horizon, roseMid, smoothstep(0.0, 0.15, h));
          col = mix(col, zenith, smoothstep(0.10, 0.38, h));

          float sunAmt = max(dot(dir, uSunDir), 0.0);
          col += vec3(1.0, 0.78, 0.46) * pow(sunAmt, 2.8) * 0.34;

          if (dir.y > 0.02) {
            vec2 uv = dir.xz / (dir.y + 0.20) * 1.12 + vec2(uTime * 0.0014, 0.0);
            float c1 = fbm(uv * 1.55);
            float c2 = fbm(uv * 3.1 + vec2(4.2, 1.7));
            float cloudDensity = c1 * 0.74 + c2 * 0.26;

            float band = smoothstep(0.05, 0.16, dir.y) * smoothstep(0.44, 0.22, dir.y);
            float mask = smoothstep(0.44, 0.58, cloudDensity) * band;
            float litEdge = smoothstep(0.36, 0.68, c1);
            vec3 cloudShadow = vec3(0.70, 0.46, 0.64);
            vec3 cloudLit    = vec3(1.00, 0.89, 0.74);
            vec3 cloudCol = mix(cloudShadow, cloudLit, litEdge);
            col = mix(col, cloudCol, mask * 0.92);
          }

          gl_FragColor = vec4(col, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(240, 48, 32), skyMat));

    // ------------------------------------------------------------
    // 4. Sculpted Desert Dunes & Wet-to-Dry Shoreline Sand
    // ------------------------------------------------------------
    function smoothAbs(x, eps = 0.16) {
      return Math.sqrt(x * x + eps * eps);
    }

    function basinRadiusFactor(x, z) {
      const dx = x / 12.8;
      const dz = (z - 0.6) / 8.5;
      const theta = Math.atan2(dz, dx);
      const mod = 1.0 + 0.09 * Math.sin(theta * 2.0 + 0.55) + 0.06 * Math.cos(theta * 3.0 - 0.8) + 0.03 * Math.sin(theta * 5.0);
      return Math.sqrt(dx * dx + dz * dz) / mod;
    }

    function duneRidge(x, z, cx, cz, angle, width, length, height, asym = 0.75, curveAmp = 0.28) {
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const rx = (x - cx) * ca - (z - cz) * sa;
      const rz = (x - cx) * sa + (z - cz) * ca;
      const crestOffset = Math.sin(rz / length * 2.2 + 0.4) * (width * curveAmp);
      const u = (rx - crestOffset) / width;
      const side = u < 0 ? smoothAbs(u, 0.16) : smoothAbs(u, 0.16) * (1.0 + asym);
      const ridge = Math.max(0, 1.0 - side);
      const smooth = Math.pow(ridge, 1.45);
      const along = Math.exp(-Math.pow(rz / length, 2));
      return smooth * along * height;
    }

    function getTerrainHeight(x, z) {
      const r = basinRadiusFactor(x, z);
      const r2 = r * r;

      const poolDepth = -1.78 * Math.exp(-r2 * 1.95) - 0.14 * Math.exp(-r2 * 0.85);
      const basinMask = Math.exp(-r2 * 1.18);

      const centerPeak = duneRidge(x, z, 2.2, -46, -0.18, 28, 24, 10.6, 0.95, 0.26);
      const leftMid    = duneRidge(x, z, -24, -34, -0.45, 28, 26, 7.6, 0.85, 0.20);
      const leftOuter  = duneRidge(x, z, -46, -24, -0.25, 34, 34, 10.2, 0.75, 0.16);
      const rightMid   = duneRidge(x, z, 31, -28, 0.42, 34, 32, 12.8, 0.85, 0.18);
      const farLeft    = duneRidge(x, z, -60, -82, 0.12, 46, 40, 13.5, 0.65, 0.15);
      const farRight   = duneRidge(x, z, 62, -78, -0.18, 48, 40, 15.0, 0.65, 0.15);

      const outerFade = THREE.MathUtils.smoothstep(r, 0.84, 1.95);
      const dunes = Math.max(centerPeak, leftMid * 0.92, leftOuter * 0.96, rightMid, farLeft * 0.95, farRight * 0.95)
                  + 0.22 * (centerPeak + leftMid + rightMid);
      const shoreRim = Math.exp(-Math.pow(r - 1.04, 2) * 5.0) * 0.38;
      const camClear = 1.0 - Math.exp(-Math.pow(x / 11.5, 2) - Math.pow((z - 17.5) / 7.5, 2));

      return poolDepth + (dunes * outerFade + shoreRim) * (1.0 - basinMask * 0.94) * (0.22 + 0.78 * camClear);
    }

    function createSandBumpTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(512, 512);
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const warp = Math.sin(x * 0.035) * 4.5 + Math.cos(x * 0.09) * 1.4;
          const ripple = Math.sin(y * 0.34 + warp) * 0.5 + 0.5;
          const fine = Math.sin(y * 0.72 + warp * 1.3) * 0.5 + 0.5;
          const grain = Math.abs((Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1);
          const v = Math.floor((ripple * 0.60 + fine * 0.18 + grain * 0.22) * 255);
          const idx = (y * 512 + x) * 4;
          img.data[idx] = img.data[idx + 1] = img.data[idx + 2] = v;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(54, 54);
      return tex;
    }

    const terrainGeo = new THREE.PlaneGeometry(250, 250, 260, 260);
    terrainGeo.rotateX(-Math.PI / 2);
    const tPos = terrainGeo.attributes.position;
    const tColors = new Float32Array(tPos.count * 3);

    const deepWetSand = new THREE.Color(0x6d5234);
    const wetSand = new THREE.Color(0xa68256);
    const warmSand = new THREE.Color(0xe6c28a);
    const sunlitSand = new THREE.Color(0xf8dfb0);
    const cTmp = new THREE.Color();

    // Plant cluster centers for soft ground contact AO under bushes & palms
    const aoSpots = [
      [-10.6, 3.8, 3.2], [-11.4, 0.4, 3.4], [-9.4, -3.6, 3.2],
      [10.6, 3.8, 3.2],  [11.4, 0.4, 3.4],  [9.4, -3.6, 3.2],
      [-4.9, 11.2, 2.8], [4.9, 11.2, 2.8],
      [-4.2, 11.4, 2.6], [-2.9, 13.0, 2.6], [-1.7, 14.3, 2.2], [-4.8, 12.6, 2.6],
      [4.2, 11.4, 2.6],  [2.9, 13.0, 2.6],  [1.9, 14.2, 2.2],  [4.8, 12.4, 2.6],
      [-9.6, 11.4, 2.5], [9.8, 11.2, 2.5], [-6.8, -5.2, 2.6], [6.8, -5.0, 2.6]
    ];

    for (let i = 0; i < tPos.count; i++) {
      const x = tPos.getX(i);
      const z = tPos.getZ(i);
      const y = getTerrainHeight(x, z);
      tPos.setY(i, y);

      if (y < 0.05) {
        cTmp.copy(deepWetSand).lerp(wetSand, THREE.MathUtils.clamp((y + 0.12) / 0.17, 0, 1));
      } else if (y < 0.48) {
        cTmp.copy(wetSand).lerp(warmSand, THREE.MathUtils.clamp((y - 0.05) / 0.43, 0, 1));
      } else {
        cTmp.copy(warmSand).lerp(sunlitSand, THREE.MathUtils.clamp((y - 0.48) / 9.5, 0, 1));
      }

      // Soft contact AO under vegetation clusters
      let ao = 1.0;
      for (let k = 0; k < aoSpots.length; k++) {
        const dx = x - aoSpots[k][0];
        const dz = z - aoSpots[k][1];
        const r = aoSpots[k][2];
        const d2 = dx * dx + dz * dz;
        if (d2 < r * r) {
          ao *= 0.62 + 0.38 * (d2 / (r * r));
        }
      }
      cTmp.multiplyScalar(ao);

      tColors[i * 3] = cTmp.r;
      tColors[i * 3 + 1] = cTmp.g;
      tColors[i * 3 + 2] = cTmp.b;
    }
    terrainGeo.setAttribute('color', new THREE.BufferAttribute(tColors, 3));
    terrainGeo.computeVertexNormals();

    const sandBumpTex = createSandBumpTexture();
    sandBumpTex.wrapS = sandBumpTex.wrapT = THREE.RepeatWrapping;
    sandBumpTex.repeat.set(36, 36);
    sandBumpTex.anisotropy = 4;

    const terrain = new THREE.Mesh(
      terrainGeo,
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.92,
        metalness: 0.0,
        bumpMap: sandBumpTex,
        bumpScale: 0.14
      })
    );
    terrain.receiveShadow = true;
    terrain.castShadow = false;
    scene.add(terrain);

    // ------------------------------------------------------------
    // 5. Physically-Based Oasis Water
    // ------------------------------------------------------------
    const waterShader = {
      uniforms: {
        color: { value: null },
        tDiffuse: { value: null },
        textureMatrix: { value: null },
        uTime: { value: 0 },
        uSunDir: { value: sunDir }
      },
      vertexShader: `
        uniform mat4 textureMatrix;
        uniform float uTime;
        varying vec4 vUv;
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float w1 = sin(dot(wp.xz, vec2(1.4, 0.9)) - uTime * 3.1) * 0.004;
          float w2 = sin(dot(wp.xz, vec2(-1.8, 1.2)) - uTime * 3.8) * 0.0025;
          wp.y += w1 + w2;
          vWorldPos = wp.xyz;
          vUv = textureMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform float uTime;
        uniform vec3 uSunDir;
        varying vec4 vUv;
        varying vec3 vWorldPos;

        const float PI = 3.14159265359;
        const float G  = 9.81;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float vnoise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float getWaterDepth(vec2 xz) {
          float dx = xz.x / 12.8;
          float dz = (xz.y - 0.6) / 8.5;
          float theta = atan(dz, dx);
          float mod = 1.0 + 0.09 * sin(theta * 2.0 + 0.55) + 0.06 * cos(theta * 3.0 - 0.8) + 0.03 * sin(theta * 5.0);
          float r = sqrt(dx * dx + dz * dz) / mod;
          float r2 = r * r;
          float floorY = -1.78 * exp(-r2 * 1.95) - 0.14 * exp(-r2 * 0.85);
          return max(0.0, 0.02 - floorY);
        }

        vec2 waveGradient(vec2 p, float t, float d) {
          // Real calm-pond physics:
          // 1) Ultra-gentle long-wavelength pond swells (smooth liquid reflections)
          vec2 grad = vec2(0.0);
          grad += vec2( 0.85,  0.52) * cos(dot(p, vec2(0.75, 0.45)) - t * 0.85) * 0.0022;
          grad += vec2(-0.55,  0.83) * cos(dot(p, vec2(-0.55, 0.90)) - t * 0.65) * 0.0018;
          grad += vec2( 0.30, -0.95) * cos(dot(p, vec2(0.40, -1.25)) - t * 1.05) * 0.0014;

          // 2) Anisotropic "cat's paw" wind-gust patches (smoothly bounded, not uniform everywhere)
          vec2 windUv = p * vec2(0.14, 0.34) + vec2(t * 0.025, -t * 0.012);
          float gust = vnoise(windUv) * 0.65 + vnoise(windUv * 2.1 + vec2(3.7, 1.9)) * 0.35;
          float catspaw = smoothstep(0.46, 0.74, gust);

          float shallowDamp = smoothstep(0.015, 0.28, d);
          float ampMask = shallowDamp * (0.10 + 0.90 * catspaw);

          // 3) Soft capillary wind ripples inside the cat's-paw patches (anisotropic along breeze)
          vec2 capP = p * vec2(2.4, 5.2);
          float e = 0.05;
          float n0 = vnoise(capP + vec2(t * 0.22, -t * 0.14)) * 0.6 + vnoise(capP * 1.9 + vec2(-t * 0.18, t * 0.20)) * 0.4;
          float nx = vnoise(capP + vec2(e, 0.0) + vec2(t * 0.22, -t * 0.14)) * 0.6 + vnoise((capP + vec2(e, 0.0)) * 1.9 + vec2(-t * 0.18, t * 0.20)) * 0.4;
          float nz = vnoise(capP + vec2(0.0, e) + vec2(t * 0.22, -t * 0.14)) * 0.6 + vnoise((capP + vec2(0.0, e)) * 1.9 + vec2(-t * 0.18, t * 0.20)) * 0.4;
          grad += vec2((nx - n0) / e, (nz - n0) / e) * 0.0042 * ampMask;

          // 4) Delicate concentric pond rings around two quiet spots
          float r1 = length(p - vec2(-2.6, 1.4));
          grad += normalize(p - vec2(-2.6, 1.4) + 1e-4) * cos(r1 * 11.0 - t * 2.2) * exp(-r1 * 0.95) * 0.0045;
          float r2 = length(p - vec2(3.4, -0.8));
          grad += normalize(p - vec2(3.4, -0.8) + 1e-4) * cos(r2 * 10.0 - t * 1.9 + 1.8) * exp(-r2 * 1.05) * 0.0040;

          return grad;
        }

        float causticLayer(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          float minDist = 1.0;
          for (int y = -1; y <= 1; y++) {
            for (int x = -1; x <= 1; x++) {
              vec2 nb = vec2(float(x), float(y));
              vec2 pt = vec2(
                hash(i + nb),
                hash(i + nb + vec2(37.2, 91.7))
              );
              pt = 0.5 + 0.42 * sin(uTime * 1.05 + 6.2831 * pt);
              float d = length(nb + pt - f);
              minDist = min(minDist, d);
            }
          }
          return pow(clamp(minDist, 0.0, 1.0), 5.5);
        }

        float causticPattern(vec2 p, float t) {
          float c1 = causticLayer(p * 3.4 + vec2(t * 0.09, -t * 0.06));
          float c2 = causticLayer(p * 4.8 + vec2(-t * 0.07, t * 0.08) + vec2(4.1, 2.3));
          return clamp((c1 + c2) * 0.85, 0.0, 1.0);
        }

        float D_GGX(float NdotH, float alpha) {
          float a2 = alpha * alpha;
          float denom = NdotH * NdotH * (a2 - 1.0) + 1.0;
          return a2 / (PI * denom * denom + 1e-6);
        }

        void main() {
          vec2 p = vWorldPos.xz;
          float depth = getWaterDepth(p);
          if (depth <= 0.002) discard;

          vec2 grad = waveGradient(p, uTime, depth);
          vec3 N = normalize(vec3(-grad.x, 1.0, -grad.y));
          vec3 V = normalize(cameraPosition - vWorldPos);
          float NdotV = clamp(dot(N, V), 0.001, 1.0);

          float F0 = 0.0204;
          float fresnel = F0 + (1.0 - F0) * pow(1.0 - NdotV, 5.0);

          vec3 refracted = refract(-V, N, 1.0 / 1.333);
          float cosThetaT = max(abs(refracted.y), 0.25);
          float opticalPath = depth / cosThetaT;

          // Real-world clear mineral-teal oasis water with sharp delicate caustics
          vec3 sigma = vec3(1.85, 0.44, 0.36);
          vec3 transmittance = exp(-sigma * opticalPath * 1.25);

          // Snell's-law refracted underwater sand bed with wind ripples & fine grain
          vec2 floorSample = p + refracted.xz * (depth / cosThetaT) * 0.38;
          float bedRipple = sin(floorSample.x * 4.2 + sin(floorSample.y * 1.8) * 1.6) * 0.5 + 0.5;
          float bedGrain = vnoise(floorSample * 7.5);
          vec3 sandBed = vec3(0.54, 0.43, 0.28) * (0.90 + 0.14 * bedRipple + 0.08 * bedGrain);

          // RGB Chromatic Dispersion Caustics (wavelength-dependent refraction)
          vec2 dispDir = normalize(refracted.xz + 1e-4) * 0.022 * clamp(depth, 0.0, 1.2);
          float cR = causticPattern(floorSample - dispDir, uTime);
          float cG = causticPattern(floorSample, uTime);
          float cB = causticPattern(floorSample + dispDir, uTime);
          float causticMask = smoothstep(0.04, 0.20, depth) * smoothstep(2.2, 0.30, depth);
          vec3 causticRGB = vec3(cR * 1.05, cG * 0.98, cB * 0.86) * causticMask * 0.65;
          vec3 sandFloor = sandBed + causticRGB;

          // Subsurface scattering in shallow water & wavelets
          float sssAngle = pow(max(dot(V, -uSunDir), 0.0), 3.5);
          float waveSlope = clamp(length(grad) * 28.0, 0.0, 1.0);
          vec3 scatterCol = vec3(0.025, 0.16, 0.17) + vec3(0.06, 0.18, 0.14) * (sssAngle * 0.50 + waveSlope * 0.22);
          vec3 refractedCol = sandFloor * transmittance + scatterCol * (1.0 - transmittance);

          // Shoreline capillary meniscus & seamless wet-sand transition
          float meniscus = smoothstep(0.14, 0.005, depth);
          refractedCol = mix(refractedCol, vec3(0.42, 0.32, 0.20), meniscus * 0.62);

          vec4 projUv = vUv;
          projUv.xy += vec2(N.x * 0.032, N.z * 0.068) * projUv.w;
          vec3 reflCol = texture2DProj(tDiffuse, projUv).rgb * 0.90;

          float reflWeight = clamp(fresnel * 1.28 + 0.06, 0.06, 0.78);
          vec3 col = mix(refractedCol, reflCol, reflWeight);

          // Dual-lobe GGX specular: crisp sun-diamond glints + soft sky sheen
          vec3 H = normalize(uSunDir + V);
          float NdotH = max(dot(N, H), 0.0);
          float NdotL = max(dot(N, uSunDir), 0.0);
          float specSharp = D_GGX(NdotH, 0.018) * fresnel * NdotL;
          float specBroad = D_GGX(NdotH, 0.13) * fresnel * NdotL;
          col += vec3(1.0, 0.90, 0.72) * (min(specSharp * 0.32, 1.5) + min(specBroad * 0.18, 0.4));

          float foamNoise = vnoise(p * 2.8 + vec2(uTime * 0.12, -uTime * 0.10));
          float lap = smoothstep(0.08, 0.012, depth + foamNoise * 0.018) * smoothstep(0.004, 0.025, depth);
          col = mix(col, vec3(0.86, 0.85, 0.78), lap * 0.30);

          float alpha = smoothstep(0.001, 0.13, depth);
          gl_FragColor = vec4(col, alpha);
        }
      `
    };

    function createPalmBarkTextures() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 512;
      const ctx = c.getContext('2d');

      const b = document.createElement('canvas');
      b.width = 256;
      b.height = 512;
      const btx = b.getContext('2d');

      ctx.fillStyle = '#5c412d';
      ctx.fillRect(0, 0, 256, 512);
      btx.fillStyle = '#606060';
      btx.fillRect(0, 0, 256, 512);

      // Diamond-shaped leaf-scar scales typical of real date/coconut palms
      const rows = 28;
      const cols = 6;
      const rh = 512 / rows;
      const cw = 256 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let col = -1; col <= cols; col++) {
          const x = col * cw + offset;
          const y = r * rh;

          // Color diamond
          const g = ctx.createLinearGradient(x, y, x, y + rh);
          g.addColorStop(0.0, '#7a593e');
          g.addColorStop(0.55, '#593e2b');
          g.addColorStop(1.0, '#362317');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(x + cw * 0.5, y);
          ctx.lineTo(x + cw, y + rh * 0.55);
          ctx.lineTo(x + cw * 0.5, y + rh);
          ctx.lineTo(x, y + rh * 0.55);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = 'rgba(30, 18, 10, 0.55)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Bump diamond
          const bg = btx.createLinearGradient(x, y, x, y + rh);
          bg.addColorStop(0.0, '#d8d8d8');
          bg.addColorStop(0.7, '#787878');
          bg.addColorStop(1.0, '#222222');
          btx.fillStyle = bg;
          btx.beginPath();
          btx.moveTo(x + cw * 0.5, y);
          btx.lineTo(x + cw, y + rh * 0.55);
          btx.lineTo(x + cw * 0.5, y + rh);
          btx.lineTo(x, y + rh * 0.55);
          btx.closePath();
          btx.fill();
        }
      }

      const map = new THREE.CanvasTexture(c);
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(1, 5);
      map.colorSpace = THREE.SRGBColorSpace;

      const bumpMap = new THREE.CanvasTexture(b);
      bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(1, 5);

      return { map, bumpMap };
    }

    // High-res alpha-cutout fern frond texture (organic rounded pinnae, not polygon spikes)
    function createFernTexture() {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 1024;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 512, 1024);

      // Central rachis stem
      ctx.strokeStyle = '#3b5c1f';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(256, 1010);
      ctx.lineTo(256, 20);
      ctx.stroke();

      const pairs = 28;
      for (let i = 0; i < pairs; i++) {
        const t = i / (pairs - 1);
        const y = 980 - t * 930;
        const span = Math.sin(Math.pow(t, 0.65) * Math.PI) * 215 + 16;
        const w = 18 * (1.0 - t * 0.45);

        for (const side of [-1, 1]) {
          const tipX = 256 + side * span;
          const tipY = y - 22 - t * 18;
          const g = ctx.createLinearGradient(256, y, tipX, tipY);
          g.addColorStop(0, '#2a4d19');
          g.addColorStop(0.6, '#487625');
          g.addColorStop(1, '#7ca134');

          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(256, y + w * 0.5);
          ctx.quadraticCurveTo(256 + side * span * 0.55, y + w * 0.45, tipX, tipY);
          ctx.quadraticCurveTo(256 + side * span * 0.45, y - w * 0.85, 256, y - w * 0.55);
          ctx.closePath();
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ------------------------------------------------------------
    // 7. Real Palm Trees (Quixel Megascans Stems & Leaflets Atlas + Seamless Bark)
    // ------------------------------------------------------------
    const LEAFLET_UVS = [
      [0.470, 0.506, 0.22, 0.94],
      [0.549, 0.585, 0.19, 0.94],
      [0.626, 0.659, 0.26, 0.93],
      [0.708, 0.740, 0.22, 0.94],
      [0.775, 0.821, 0.24, 0.93],

    function createCurvedPalmFrondGeometry(length, maxLeafLen, pairs = 34, seed = 0) {
      const positions = [], uvs = [], colors = [], indices = [];
      let vIdx = 0;

      const stemCol = new THREE.Color(0xa6b554);
      const baseCol = new THREE.Color(0x889e3c);
      const midCol  = new THREE.Color(0xb8c954);
      const tipCol  = new THREE.Color(0xefe47c);
      const c = new THREE.Color();

      // Arching Megascans palm stem / rachis (crossed V-ribbon so visible from all angles)
      const stemSegs = 18;
      const uStem0 = 0.197, uStem1 = 0.259;
      for (let i = 0; i < stemSegs; i++) {
        const t0 = i / stemSegs, t1 = (i + 1) / stemSegs;
        const z0 = t0 * length, z1 = t1 * length;
        const y0 = Math.sin(t0 * Math.PI * 0.64) * 0.54 - Math.pow(t0, 1.75) * length * 0.36;
        const y1 = Math.sin(t1 * Math.PI * 0.64) * 0.54 - Math.pow(t1, 1.75) * length * 0.36;
        const w0 = 0.062 * (1.0 - t0 * 0.68);
        const w1 = 0.062 * (1.0 - t1 * 0.68);
        const v0 = 0.06 + t0 * 0.88;
        const v1 = 0.06 + t1 * 0.88;

        // Horizontal plane of stem
        positions.push(-w0, y0, z0, w0, y0, z0, -w1, y1, z1, w1, y1, z1);
        uvs.push(uStem0, v0, uStem1, v0, uStem0, v1, uStem1, v1);
        for (let k = 0; k < 4; k++) colors.push(stemCol.r, stemCol.g, stemCol.b);
        indices.push(vIdx, vIdx + 1, vIdx + 2, vIdx + 1, vIdx + 3, vIdx + 2);
        vIdx += 4;

        // Vertical rib of stem
        positions.push(0, y0 - w0 * 0.6, z0, 0, y0 + w0 * 0.6, z0, 0, y1 - w1 * 0.6, z1, 0, y1 + w1 * 0.6, z1);
        uvs.push(uStem0, v0, uStem1, v0, uStem0, v1, uStem1, v1);
        for (let k = 0; k < 4; k++) colors.push(stemCol.r, stemCol.g, stemCol.b);
        indices.push(vIdx, vIdx + 1, vIdx + 2, vIdx + 1, vIdx + 3, vIdx + 2);
        vIdx += 4;
      }

      // 5-row curved 3D Megascans alpha-cutout leaflets along the rachis (wider, fuller overlap)
      const rows = [0.0, 0.25, 0.52, 0.78, 1.0];
      for (let i = 1; i <= pairs; i++) {
        const t = i / (pairs + 1);
        const zBase = t * length * 0.96 + 0.14;
        const yBase = Math.sin(t * Math.PI * 0.64) * 0.54 - Math.pow(t, 1.75) * length * 0.36;
        const leafLen = Math.pow(Math.max(0, Math.sin(Math.pow(t, 0.72) * Math.PI)), 0.75) * maxLeafLen;
        const cardWidth = 0.215 * (1.0 - t * 0.24);

        if (t < 0.45) {
          c.copy(baseCol).lerp(midCol, t / 0.45);
        } else {
          c.copy(midCol).lerp(tipCol, (t - 0.45) / 0.55);
        }

        for (const side of [-1, 1]) {
          const hash = Math.abs(Math.sin((i * 12.9898 + side * 78.233 + seed * 37.7)));
          const uvBox = LEAFLET_UVS[Math.floor(hash * LEAFLET_UVS.length) % LEAFLET_UVS.length];
          const [uL, uR, vBot, vTop] = uvBox;

          const jitter = Math.sin(i * 2.7 + side + seed) * 0.12;
          const sweep = 0.60 + t * 0.48 + jitter;
          const dirX = side * Math.sin(sweep);
          const dirZ = Math.cos(sweep) * 0.68;

          const twist = side * 0.32 + jitter * 1.2;
          const perpX = -dirZ * Math.sin(twist) * 0.35;
          const perpY = Math.sin(twist) * 0.45;
          const perpZ = Math.cos(twist);

          for (let r = 0; r < rows.length; r++) {
            const f = rows[r];
            const px = dirX * leafLen * f;
            const pz = zBase + dirZ * leafLen * f;
            const py = yBase + Math.sin(f * Math.PI * 0.80) * leafLen * 0.18 - Math.pow(f, 1.95) * leafLen * (0.58 + Math.abs(jitter) * 0.28);

            const halfW = cardWidth * 0.5;
            positions.push(
              px - perpX * halfW, py - perpY * halfW, pz - perpZ * halfW,
              px + perpX * halfW, py + perpY * halfW, pz + perpZ * halfW
            );
            const vUV = vBot + (vTop - vBot) * f;
            uvs.push(uL, vUV, uR, vUV);
            const rowCol = f < 0.35 ? baseCol : c;
            colors.push(rowCol.r, rowCol.g, rowCol.b, rowCol.r, rowCol.g, rowCol.b);
          }

          for (let r = 0; r < rows.length - 1; r++) {
            const a = vIdx + r * 2;
            indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
          vIdx += rows.length * 2;
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const sharedFrondGeos = [
      createCurvedPalmFrondGeometry(4.0, 1.26, 36, 1),
      createCurvedPalmFrondGeometry(3.7, 1.16, 34, 2),
      createCurvedPalmFrondGeometry(4.2, 1.32, 38, 3)
    ];
    const coconutGeo = new THREE.SphereGeometry(0.16, 10, 10);
    const coconutMat = new THREE.MeshStandardMaterial({ color: 0x5d3d1e, roughness: 0.72 });
    const skirtGeo = new THREE.CylinderGeometry(0.28, 0.16, 0.55, 10);
    const skirtMat = new THREE.MeshStandardMaterial({ color: 0x422b1a, roughness: 0.95 });
    const palmCrowns = [];

    function createPalmTree(x, z, height, leanX, leanZ, scale = 1.0, frondCount = 26) {
      const yBase = getTerrainHeight(x, z) - 0.25;
      const group = new THREE.Group();
      group.position.set(x, yBase, z);

      const h1 = Math.sin(x * 1.37 + z * 2.13);
      const h2 = Math.cos(x * 2.71 - z * 1.19);
      const h3 = Math.sin(x * 3.91 + z * 0.77);
      const dirSign = leanX >= 0 ? 1 : -1;
      const bowX = dirSign * (0.28 + 0.34 * (h1 * 0.5 + 0.5)) * scale + h2 * 0.28 * scale;
      const bowZ = h3 * 0.42 * scale;
      const midT1 = 0.28 + h2 * 0.07;
      const midT2 = 0.66 + h3 * 0.07;
      const tipX = leanX + h2 * 0.32 * scale;
      const tipZ = leanZ + h1 * 0.35 * scale;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(tipX * 0.16 - bowX * (0.35 + h3 * 0.25), height * midT1, tipZ * 0.20 + bowZ * 0.6),
        new THREE.Vector3(tipX * 0.60 + bowX * (0.30 - h1 * 0.20), height * midT2, tipZ * 0.65 - bowZ * 0.4),
        new THREE.Vector3(tipX, height, tipZ)
      ]);

      const trunkGeo = new THREE.TubeGeometry(curve, 26, 0.25 * scale, 12, false);
      const tp = trunkGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < tp.count; i++) {
        v.fromBufferAttribute(tp, i);
        const t = THREE.MathUtils.clamp(v.y / height, 0, 1);
        const cPt = curve.getPoint(t);
        v.sub(cPt).multiplyScalar(1.0 - t * 0.50).add(cPt);
        tp.setXYZ(i, v.x, v.y, v.z);
      }
      trunkGeo.computeVertexNormals();

      const trunk = new THREE.Mesh(trunkGeo, barkMat);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const crown = new THREE.Group();
      crown.position.set(tipX, height, tipZ);
      crown.rotation.z = -dirSign * (0.04 + (h1 * 0.5 + 0.5) * 0.08);
      crown.rotation.x = h3 * 0.06;

      const collar = new THREE.Mesh(skirtGeo, skirtMat);
      collar.position.y = -0.20 * scale;
      collar.scale.setScalar(scale);
      crown.add(collar);

      for (let c = 0; c < 4; c++) {
        const ca = (c / 4) * Math.PI * 2;
        const nut = new THREE.Mesh(coconutGeo, coconutMat);
        nut.position.set(Math.cos(ca) * 0.22 * scale, -0.24 * scale, Math.sin(ca) * 0.22 * scale);
        nut.scale.setScalar(scale);
        crown.add(nut);
      }

      // 3-tier lush rounded palm crown + compact inner crown core
      const upperCount = Math.round(frondCount * 0.28);
      const midCount = Math.round(frondCount * 0.40);
      const lowerCount = frondCount - upperCount - midCount;
      const tierSpecs = [
        { count: upperCount, pitchMin: 0.30, pitchMax: 0.56, scaleMult: 1.00, offset: 0.0 },
        { count: midCount,   pitchMin: 0.02, pitchMax: 0.24, scaleMult: 1.00, offset: 0.23 },
        { count: lowerCount, pitchMin: -0.26, pitchMax: -0.05, scaleMult: 1.00, offset: 0.47 }
      ];

      let fIdx = 0;
      for (const spec of tierSpecs) {
        for (let i = 0; i < spec.count; i++) {
          const frac = i / spec.count;
          const angle = (frac + spec.offset) * Math.PI * 2 + Math.sin(fIdx * 1.9 + x) * 0.14;
          const frond = new THREE.Mesh(sharedFrondGeos[fIdx % sharedFrondGeos.length], frondMat);
          const sc = (0.94 + ((fIdx * 7) % 5) * 0.03) * scale * spec.scaleMult;
          frond.scale.setScalar(sc);
          frond.rotation.y = angle;
          frond.rotation.x = -(spec.pitchMin + ((fIdx % 3) / 2) * (spec.pitchMax - spec.pitchMin));
          frond.rotation.z = Math.sin(fIdx * 2.3) * 0.10;
          frond.castShadow = true;
          frond.receiveShadow = false;
          crown.add(frond);
          fIdx++;
        }
      }

      // Soft inner core fronds matching crown length so the top stays full
      for (let i = 0; i < 8; i++) {
        const frond = new THREE.Mesh(sharedFrondGeos[i % sharedFrondGeos.length], frondMat);
        frond.scale.setScalar(0.86 * scale);
        frond.rotation.y = (i / 8) * Math.PI * 2 + 0.2;
        frond.rotation.x = -0.68 - (i % 2) * 0.14;
        frond.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.08;
        frond.castShadow = false;
        frond.receiveShadow = false;
        crown.add(frond);
      }

      group.add(crown);
      palmCrowns.push({ crown, scale, phase: x * 0.6 + z * 0.4 });
      scene.add(group);
    }

    createPalmTree(-9.6, 11.4, 7.3, 2.35, -0.5, 1.10, 38);
    createPalmTree(9.8, 11.2, 7.5, -2.45, -0.5, 1.12, 38);

    createPalmTree(-11.2, 3.0, 5.2, 1.25, 0.2, 0.86, 30);
    createPalmTree(-9.2, -1.8, 6.7, 1.15, 0.3, 0.96, 32);
    createPalmTree(-6.8, -5.2, 5.5, 0.85, 0.2, 0.82, 28);
    createPalmTree(-4.6, -6.8, 4.1, 0.65, 0.2, 0.70, 26);

    createPalmTree(5.0, -6.4, 5.7, -0.85, 0.2, 0.86, 30);
    createPalmTree(6.8, -5.0, 4.5, -0.70, 0.2, 0.74, 26);
    createPalmTree(9.0, -2.6, 6.4, -1.15, 0.3, 0.94, 32);
    createPalmTree(11.0, 2.2, 5.4, -1.30, 0.2, 0.88, 30);

    // Load Real Quixel Megascans Tropical Palm (rkqjj) as lush ground-level palm bushes along banks
    gltfLoader.load('./assets/palm/rkqjj_tier_3.gltf', (gltf) => {
      const palmVars = [];
      gltf.scene.traverse((child) => {
        if (child.isMesh && !child.name.includes('LOD') && !child.name.includes('Billboard')) {
          child.material.alphaTest = 0.42;
          child.material.transparent = false;
          child.material.side = THREE.DoubleSide;
          child.material.color.setHex(0x9eb068);
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 0.0;
          child.material.roughness = 0.58;
          applyFoliageSSS(child.material, 0.48);
          child.castShadow = true;
          child.receiveShadow = true;
          palmVars.push(child);
        }
      });
      if (palmVars.length === 0) return;

      const bushSpots = [
        [-10.6, 3.8, 0.95], [-11.4, 0.4, 1.05], [-9.4, -3.6, 0.9],
        [10.6, 3.8, 0.95],  [11.4, 0.4, 1.05],  [9.4, -3.6, 0.9],
        [-4.9, 11.2, 0.85], [4.9, 11.2, 0.85]
      ];
      bushSpots.forEach(([px, pz, ps], idx) => {
        const src = palmVars[idx % palmVars.length];
        const clone = src.clone();
        const holder = new THREE.Group();
        holder.position.set(px, getTerrainHeight(px, pz) - 0.12, pz);
        holder.scale.setScalar(ps);
        holder.rotation.y = idx * 1.4;
        holder.add(clone);
        scene.add(holder);
      });
    });

    // Load Real Quixel Megascans Leather Fern (tkytbjdia) around foreground corners & banks
    gltfLoader.load('./assets/fern/tkytbjdia_tier_3.gltf', (gltf) => {
      const fernVars = [];
      gltf.scene.traverse((child) => {
        if (child.isMesh && !child.name.includes('LOD') && !child.name.includes('Billboard')) {
          child.material.alphaTest = 0.40;
          child.material.transparent = false;
          child.material.side = THREE.DoubleSide;
          child.material.color.setHex(0xa2b56c);
          child.material.roughness = 0.56;
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 0.0;
          applyFoliageSSS(child.material, 0.50);
          child.castShadow = true;
          child.receiveShadow = true;
          fernVars.push(child);
        }
      });
      if (fernVars.length === 0) return;

      const fernSpots = [
        [-4.2, 11.4, 1.8], [-2.9, 13.0, 1.9], [-1.7, 14.3, 1.7], [-4.8, 12.6, 1.6],
        [4.2, 11.4, 1.7],  [2.9, 13.0, 1.8],  [1.9, 14.2, 1.5],  [4.8, 12.4, 1.6],
        [-10.4, 4.2, 1.6], [-11.0, 1.2, 1.7], [-9.8, -2.2, 1.5], [-7.8, -4.6, 1.4],
        [10.4, 4.2, 1.6],  [11.0, 1.2, 1.7],  [9.8, -2.2, 1.5],  [7.8, -4.6, 1.4]
      ];
      fernSpots.forEach(([fx, fz, fs], idx) => {
        const src = fernVars[idx % fernVars.length];
        const clone = src.clone();
        const holder = new THREE.Group();
        holder.position.set(fx, getTerrainHeight(fx, fz) - 0.08, fz);
        holder.scale.setScalar(fs);
        holder.rotation.y = idx * 1.1;
        holder.add(clone);
        scene.add(holder);
      });
    });

    // ------------------------------------------------------------
    // 8. Real Botanicals (Cupped 5-Petal Hibiscus, True Flower Spikes, Curved Fern Ribbons, Shoreline Reeds)
    // ------------------------------------------------------------
    function createCurvedBroadLeafGeo() {
      const geo = new THREE.PlaneGeometry(0.66, 1.55, 6, 10);
      geo.translate(0, 0.775, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = Math.max(0, z / 1.55);
        const archY = Math.sin(t * Math.PI * 0.85) * 0.22 - t * t * 0.35;
        const foldY = Math.abs(x) * 0.18;
        pos.setY(i, archY + foldY);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function createCurvedFernGeo() {
      const geo = new THREE.PlaneGeometry(0.95, 1.95, 4, 14);
      geo.translate(0, 0.975, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = Math.max(0, z / 1.95);
        const archY = Math.sin(t * Math.PI * 0.65) * 0.34 - Math.pow(t, 1.9) * 0.72;
        const droop = Math.abs(x) * 0.10;
        pos.setY(i, archY - droop);
      }
      geo.computeVertexNormals();
      return geo;
    }

    // Cupped single petal geometry (subdivided curved mesh, not a flat triangle)
    function createCuppedPetalGeo() {
      const geo = new THREE.PlaneGeometry(0.18, 0.22, 4, 5);
      geo.translate(0, 0.11, 0);
      geo.rotateX(Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const t = z / 0.22;
        const cup = Math.sin(t * Math.PI * 0.85) * 0.055 - (x * x) * 1.4;
        const ruffle = Math.sin(x * 38.0) * 0.008 * t;
        pos.setY(i, cup + ruffle);
      }
      geo.computeVertexNormals();
      return geo;
    }

    const broadLeafGeo = createCurvedBroadLeafGeo();
    const fernRibbonGeo = createCurvedFernGeo();
    const cuppedPetalGeo = createCuppedPetalGeo();
    const stemGeo = new THREE.CylinderGeometry(0.012, 0.018, 0.55, 6);
    stemGeo.translate(0, 0.275, 0);
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x355c22, roughness: 0.7 });

    const pistilGeo = new THREE.CylinderGeometry(0.006, 0.010, 0.13, 6);
    pistilGeo.translate(0, 0.065, 0);
    const pistilMat = new THREE.MeshStandardMaterial({ color: 0xfff0aa, emissive: 0x442200, roughness: 0.4 });

    const floretGeo = new THREE.SphereGeometry(0.042, 6, 5);
    floretGeo.scale(1.0, 0.75, 1.25);

    const petalMats = [
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#6d3430', '#b8685c', '#dfa08e'), alphaTest: 0.35, roughness: 0.48, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#784836', '#cc8b68', '#ecc09c'), alphaTest: 0.35, roughness: 0.48, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ map: createPetalTexture('#693b49', '#b26e7c', '#dba8b2'), alphaTest: 0.35, roughness: 0.48, side: THREE.DoubleSide })
    ];
    const purpleFloretMat = new THREE.MeshStandardMaterial({ color: 0x827a9c, emissive: 0x0e0b16, roughness: 0.78 });
    const purpleBudMat    = new THREE.MeshStandardMaterial({ color: 0x9890b2, emissive: 0x100d1a, roughness: 0.78 });

    // Slender shoreline grass/reed blades
    const grassGeo = new THREE.PlaneGeometry(0.045, 0.85, 1, 6);
    grassGeo.translate(0, 0.425, 0);
    const gp = grassGeo.attributes.position;
    for (let i = 0; i < gp.count; i++) {
      const y = gp.getY(i);
      const t = y / 0.85;
      gp.setX(i, gp.getX(i) * (1.0 - t * 0.88));
      gp.setZ(i, t * t * 0.24);
    }
    grassGeo.computeVertexNormals();
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x7c924e, roughness: 0.58, side: THREE.DoubleSide });
    applyFoliageSSS(grassMat, 0.45);

    let seed = 108;
    function rand() {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    }

    // Batch static botanical geometries by material so the entire lush oasis renders in ~10 draw calls
    const geoBuckets = new Map();
    const dummyObj = new THREE.Object3D();
    function pushGeo(mat, baseGeo, pos, rot, scale, parentMat4 = null) {
      let arr = geoBuckets.get(mat);
      if (!arr) { arr = []; geoBuckets.set(mat, arr); }
      const g = baseGeo.clone();
      dummyObj.position.copy(pos);
      dummyObj.rotation.copy(rot);
      dummyObj.scale.copy(scale);
      dummyObj.updateMatrix();
      if (parentMat4) {
        g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(parentMat4, dummyObj.matrix));
      } else {
        g.applyMatrix4(dummyObj.matrix);
      }
      arr.push(g);
    }

    const vZero = new THREE.Vector3();
    const eZero = new THREE.Euler();
    const sOne  = new THREE.Vector3(1, 1, 1);

    function addHibiscusToBuckets(pMat, worldMat) {
      for (let p = 0; p < 5; p++) {
        pushGeo(
          pMat,
          cuppedPetalGeo,
          vZero,
          new THREE.Euler(0.08 + p * 0.015, (p / 5) * Math.PI * 2 + (rand() - 0.5) * 0.12, 0),
          sOne,
          worldMat
        );
      }
      pushGeo(pistilMat, pistilGeo, vZero, new THREE.Euler(0.15, 0, 0), sOne, worldMat);
    }

    function addPurpleSpikeToBuckets(scale, worldMat) {
      pushGeo(stemMat, stemGeo, vZero, eZero, new THREE.Vector3(0.8 * scale, 1.45 * scale, 0.8 * scale), worldMat);
      const florets = 18;
      for (let i = 0; i < florets; i++) {
        const t = i / (florets - 1);
        const a = i * 2.39996;
        const r = (0.045 - t * 0.025) * scale;
        const sc = (1.05 - t * 0.55) * scale;
        pushGeo(
          t > 0.7 ? purpleBudMat : purpleFloretMat,
          floretGeo,
          new THREE.Vector3(Math.cos(a) * r, (0.34 + t * 0.44) * scale, Math.sin(a) * r),
          new THREE.Euler(0, -a, 0),
          new THREE.Vector3(sc, sc, sc),
          worldMat
        );
      }
    }

    function addLushBankCluster(cx, cz, radius, count, fernBias = 0.5, scaleBoost = 1.0) {
      const baseY = getTerrainHeight(cx, cz) - 0.10;
      const clusterMat = new THREE.Matrix4().makeTranslation(cx, baseY, cz);
      const tmpObj = new THREE.Object3D();

      for (let i = 0; i < count; i++) {
        const a = rand() * Math.PI * 2;
        const r = rand() * radius;
        const lx = Math.cos(a) * r;
        const lz = Math.sin(a) * r;

        const leaves = 6 + Math.floor(rand() * 4);
        for (let b = 0; b < leaves; b++) {
          const s = (0.78 + rand() * 0.65) * scaleBoost;
          pushGeo(
            rand() > 0.42 ? broadLeafMat : broadLeafLightMat,
            broadLeafGeo,
            new THREE.Vector3(lx, 0, lz),
            new THREE.Euler(-0.32 - rand() * 0.45, (b / leaves) * Math.PI * 2 + rand() * 0.4, 0),
            new THREE.Vector3(s, s, s),
            clusterMat
          );
        }

        if (rand() < fernBias) {
          const fCount = 5 + Math.floor(rand() * 4);
          for (let f = 0; f < fCount; f++) {
            const fs = (0.76 + rand() * 0.45) * scaleBoost;
            pushGeo(
              fernMat,
              fernRibbonGeo,
              new THREE.Vector3(lx, 0.08, lz),
              new THREE.Euler(-0.24 - rand() * 0.25, (f / fCount) * Math.PI * 2 + rand() * 0.35, 0),
              new THREE.Vector3(fs, fs, fs),
              clusterMat
            );
          }
        }

        if (rand() > 0.22) {
          if (rand() < 0.32) {
            tmpObj.position.set(lx + (rand() - 0.5) * 0.25, 0.05, lz + (rand() - 0.5) * 0.25);
            tmpObj.rotation.set((rand() - 0.5) * 0.22, rand() * Math.PI * 2, (rand() - 0.5) * 0.22);
            tmpObj.scale.set(1, 1, 1);
            tmpObj.updateMatrix();
            addPurpleSpikeToBuckets((0.85 + rand() * 0.35) * scaleBoost, new THREE.Matrix4().multiplyMatrices(clusterMat, tmpObj.matrix));
          } else {
            const pMat = petalMats[Math.floor(rand() * petalMats.length)];
            const blossoms = 1 + Math.floor(rand() * 3);
            for (let k = 0; k < blossoms; k++) {
              const bx = lx + (rand() - 0.5) * 0.32;
              const bz = lz + (rand() - 0.5) * 0.32;
              const hScale = (0.72 + rand() * 0.55) * scaleBoost;
              tmpObj.position.set(bx, 0, bz);
              tmpObj.rotation.set((rand() - 0.5) * 0.35, rand() * Math.PI * 2, (rand() - 0.5) * 0.35);
              tmpObj.scale.set(1, hScale, 1);
              tmpObj.updateMatrix();
              const stemWorld = new THREE.Matrix4().multiplyMatrices(clusterMat, tmpObj.matrix);
              pushGeo(stemMat, stemGeo, vZero, eZero, sOne, stemWorld);

              const bScale = (0.82 + rand() * 0.45) * scaleBoost / hScale;
              tmpObj.position.set(0, 0.54, 0);
              tmpObj.rotation.set(0.35 + (rand() - 0.5) * 0.4, 0, 0);
              tmpObj.scale.set(bScale, bScale, bScale);
              tmpObj.updateMatrix();
              addHibiscusToBuckets(pMat, new THREE.Matrix4().multiplyMatrices(stemWorld, tmpObj.matrix));
            }
          }
        }
      }
    }

    const bankSpots = [
      [-11.2, 4.4, 2.3, 12, 0.55, 1.15], [-11.8, 1.0, 2.4, 12, 0.5, 1.15], [-10.8, -2.4, 2.2, 10, 0.5, 1.1],
      [-8.4, -4.8, 2.1, 10, 0.45, 1.05], [-5.4, -6.6, 1.8, 8, 0.4, 1.0],
      [11.2, 4.4, 2.3, 12, 0.55, 1.15],  [11.8, 1.0, 2.4, 12, 0.5, 1.15],  [10.8, -2.4, 2.2, 10, 0.5, 1.1],
      [8.4, -4.8, 2.1, 10, 0.45, 1.05],  [5.4, -6.6, 1.8, 8, 0.4, 1.0],
      [-5.2, 10.6, 2.0, 14, 0.85, 1.25], [-3.6, 12.6, 1.6, 14, 0.92, 1.25], [-2.1, 14.2, 1.2, 12, 0.95, 1.20],
      [5.2, 10.6, 2.0, 14, 0.40, 1.25],  [3.6, 12.6, 1.6, 14, 0.35, 1.25],  [2.3, 14.0, 1.1, 10, 0.30, 1.15]
    ];
    for (const [bx, bz, rad, cnt, fb, sb] of bankSpots) {
      addLushBankCluster(bx, bz, rad, cnt, fb, sb);
    }

    // Shoreline reeds & sedge tufts strictly on the lush left/right banks
    for (let i = 0; i < 65; i++) {
      const a = rand() * Math.PI * 2;
      if (Math.cos(a) > -0.35 && Math.cos(a) < 0.35 && Math.sin(a) > 0.35) continue;
      if (Math.cos(a) > -0.45 && Math.cos(a) < 0.45 && Math.sin(a) < -0.55) continue;
      const rx = Math.cos(a) * (12.2 + (rand() - 0.5) * 1.2);
      const rz = 0.6 + Math.sin(a) * (8.2 + (rand() - 0.5) * 1.0);
      const y = getTerrainHeight(rx, rz);
      if (y < 0.01 || y > 0.48) continue;
      for (let b = 0; b < 7; b++) {
        const sc = 0.65 + rand() * 0.65;
        pushGeo(
          grassMat,
          grassGeo,
          new THREE.Vector3(rx + (rand() - 0.5) * 0.25, y - 0.04, rz + (rand() - 0.5) * 0.25),
          new THREE.Euler((rand() - 0.5) * 0.35, rand() * Math.PI * 2, 0),
          new THREE.Vector3(sc, sc, sc)
        );
      }
    }

    function addAgaveRosette(ax, az, scale = 1.0) {
      const baseMat = new THREE.Matrix4().makeTranslation(ax, getTerrainHeight(ax, az) - 0.05, az);
      const blades = 20;
      for (let i = 0; i < blades; i++) {
        const a = (i / blades) * Math.PI * 2 + (i % 2) * 0.14;
        const tier = i % 2;
        pushGeo(
          tier === 0 ? broadLeafMat : broadLeafLightMat,
          broadLeafGeo,
          vZero,
          new THREE.Euler(-0.52 - tier * 0.28, a, 0),
          new THREE.Vector3(0.55 * scale, 0.95 * scale, 1.10 * scale),
          baseMat
        );
      }
    }
    addAgaveRosette(1.35, 14.3, 0.92);
    addAgaveRosette(2.65, 13.5, 1.05);

    for (const [mat, geos] of geoBuckets.entries()) {
      const merged = mergeGeometries(geos, false);
      const mesh = new THREE.Mesh(merged, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    // ------------------------------------------------------------
    // 9. Volumetric God Rays, Shoreline Stones & Ambient Life
    // ------------------------------------------------------------
    const godRayMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vNormalW = normalize(mat3(modelMatrix) * normal);
          vViewDir = normalize(cameraPosition - wp.xyz);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vNormalW;
        varying vec3 vViewDir;
        uniform float uTime;
        void main() {
          float edgeX = sin(vUv.x * 3.14159265);
          edgeX = pow(max(0.0001, edgeX), 1.8);
          float fadeY = smoothstep(0.0, 0.38, vUv.y) * smoothstep(1.0, 0.15, vUv.y);
          float streak = 0.65 + 0.35 * sin(vUv.x * 18.0 + uTime * 0.45) * cos(vUv.x * 9.0 - uTime * 0.3);
          float facing = pow(max(0.0001, abs(dot(normalize(vNormalW), normalize(vViewDir)))), 0.65);
          float alpha = edgeX * fadeY * streak * facing * 0.135;
          gl_FragColor = vec4(1.0, 0.82, 0.48, alpha);
        }
      `
    });

    const raySpecs = [
      { x: -7.5, y: 7.2, z: -2.0, w: 6.5, h: 18.0, ry: 0.35, rz: -0.78 },
      { x: -4.2, y: 7.6, z: -4.5, w: 7.5, h: 19.5, ry: 0.22, rz: -0.75 },
      { x: -1.5, y: 8.0, z: -6.0, w: 8.0, h: 20.0, ry: 0.10, rz: -0.74 },
      { x: -8.8, y: 6.4, z:  4.0, w: 5.5, h: 16.5, ry: 0.48, rz: -0.80 },
      { x: -5.2, y: 6.8, z:  2.2, w: 6.2, h: 17.5, ry: 0.28, rz: -0.76 },
      { x:  1.2, y: 8.2, z: -7.5, w: 7.0, h: 19.0, ry: -0.05, rz: -0.72 }
    ];
    for (const rs of raySpecs) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(rs.w, rs.h), godRayMat);
      mesh.position.set(rs.x, rs.y, rs.z);
      mesh.rotation.set(0, rs.ry, rs.rz);
      scene.add(mesh);
    }

    // Smooth sun-warmed oasis shoreline stones
    const stoneGeo = new THREE.DodecahedronGeometry(0.18, 1);
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0xc29e78, roughness: 0.82, metalness: 0.02 });
    const stoneInst = new THREE.InstancedMesh(stoneGeo, stoneMat, 36);
    stoneInst.castShadow = true;
    stoneInst.receiveShadow = true;
    const stoneDummy = new THREE.Object3D();
    for (let i = 0; i < 36; i++) {
      const ang = (i / 36) * Math.PI * 2 + rand() * 0.15;
      const rad = 0.96 + rand() * 0.10;
      const sx = Math.cos(ang) * 12.6 * rad;
      const sz = 0.6 + Math.sin(ang) * 8.3 * rad;
      const sy = getTerrainHeight(sx, sz) - 0.02;
      stoneDummy.position.set(sx, sy, sz);
      stoneDummy.rotation.set(rand() * 0.6, rand() * Math.PI * 2, rand() * 0.6);
      stoneDummy.scale.set(0.7 + rand() * 1.1, 0.45 + rand() * 0.4, 0.7 + rand() * 1.0);
      stoneDummy.updateMatrix();
      stoneInst.setMatrixAt(i, stoneDummy.matrix);
    }
    scene.add(stoneInst);

    // Gentle golden-hour dragonflies / butterflies hovering over the oasis
    const flyers = [];
    const flyerMat = new THREE.MeshBasicMaterial({ color: 0xffe4a0, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
    const wingGeo = new THREE.PlaneGeometry(0.10, 0.05);
    for (let i = 0; i < 6; i++) {
      const fGroup = new THREE.Group();
      const wL = new THREE.Mesh(wingGeo, flyerMat);
      const wR = new THREE.Mesh(wingGeo, flyerMat);
      wL.position.x = -0.05;
      wR.position.x = 0.05;
      fGroup.add(wL, wR);
      const basePos = new THREE.Vector3((rand() - 0.5) * 12, 0.55 + rand() * 1.4, -2 + rand() * 9);
      fGroup.position.copy(basePos);
      scene.add(fGroup);
      flyers.push({ group: fGroup, wL, wR, base: basePos, phase: rand() * Math.PI * 2, speed: 0.8 + rand() * 0.7 });
    }

    // Low-lying drifting oasis mist / fog layers over water & dune base
    const mistMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
          return v;
        }
        void main() {
          vec2 centered = vUv - 0.5;
          float radial = smoothstep(0.50, 0.08, length(centered));
          float n = fbm(vUv * vec2(3.2, 2.0) + vec2(uTime * 0.025, -uTime * 0.01));
          float alpha = radial * smoothstep(0.35, 0.80, n) * 0.085;
          gl_FragColor = vec4(0.96, 0.90, 0.84, alpha);
        }
      `
    });
    const mistConfigs = [
      { x: -6.0, y: 1.85, z: -13.0, w: 22, d: 10, rx: -Math.PI * 0.36 },
      { x:  6.0, y: 1.95, z: -14.0, w: 22, d: 10, rx: -Math.PI * 0.36 },
      { x:  0.0, y: 2.35, z: -20.0, w: 34, d: 12, rx: -Math.PI * 0.32 }
    ];
    for (const mc of mistConfigs) {
      const mMesh = new THREE.Mesh(new THREE.PlaneGeometry(mc.w, mc.d), mistMat);
      mMesh.position.set(mc.x, mc.y, mc.z);
      mMesh.rotation.x = mc.rx;
      scene.add(mMesh);
    }

    // Fine Floating Golden Dust Particles
    const moteCount = 380;
    const motePos = new Float32Array(moteCount * 3);
    const motePhase = new Float32Array(moteCount);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3]     = (rand() - 0.5) * 26;
      motePos[i * 3 + 1] = 0.25 + rand() * 7.5;
      motePos[i * 3 + 2] = -8 + rand() * 21;
      motePhase[i] = rand() * Math.PI * 2;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    moteGeo.setAttribute('aPhase', new THREE.BufferAttribute(motePhase, 1));

    const moteMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 } },
      vertexShader: `
        attribute float aPhase;
        uniform float uTime;
        varying float vAlpha;
        void main() {
          vec3 p = position;
          p.y += sin(uTime * 0.45 + aPhase) * 0.28;
          p.x += cos(uTime * 0.30 + aPhase * 1.3) * 0.25;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (9.5 / -mv.z) * (0.60 + 0.40 * sin(uTime * 1.6 + aPhase));
          vAlpha = 0.22 + 0.28 * sin(uTime * 1.3 + aPhase);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - vec2(0.5));
          if (d > 0.5) discard;
          float glow = pow(1.0 - d * 2.0, 2.4);
          gl_FragColor = vec4(1.0, 0.92, 0.74, glow * vAlpha);
        }
      `
    });
    scene.add(new THREE.Points(moteGeo, moteMat));

    // ------------------------------------------------------------
    // 10. Animation Loop & Resize
    // ------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      skyMat.uniforms.uTime.value = t;
      waterReflector.material.uniforms.uTime.value = t;
      moteMat.uniforms.uTime.value = t;
      mistMat.uniforms.uTime.value = t;
      godRayMat.uniforms.uTime.value = t;
      animeFilmicPass.uniforms.uTime.value = t;

      for (const fl of flyers) {
        fl.group.position.x = fl.base.x + Math.sin(t * fl.speed + fl.phase) * 1.1;
        fl.group.position.y = fl.base.y + Math.sin(t * fl.speed * 1.7 + fl.phase) * 0.22;
        fl.group.position.z = fl.base.z + Math.cos(t * fl.speed * 0.8 + fl.phase) * 0.9;
        const flap = Math.sin(t * 22.0 + fl.phase) * 0.65;
        fl.wL.rotation.z = flap;
        fl.wR.rotation.z = -flap;
      }

      for (const item of palmCrowns) {
        item.crown.rotation.z = Math.sin(t * 0.85 + item.phase) * 0.025;
        item.crown.rotation.x = Math.cos(t * 0.65 + item.phase) * 0.018;
      }

      controls.update();
      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
